<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7490">
<meta name="description" content="جعبه ابزار کفپوش سی تک پارسیان">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سی تک پارسیان">
<meta name="color-scheme" content="dark light">
<title>جعبه ابزار کفپوش سی تک پارسیان</title>
<link id="manifestLink" rel="manifest" href="">
<link id="faviconLink" rel="icon" href="">
<link id="appleIconLink" rel="apple-touch-icon" href="">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@font-face {
  font-family: 'BYekan';
  src: url('https://cdn.jsdelivr.net/gh/font-store/font-B-Yekan/BYekan.ttf') format('truetype'),
       url('https://cdn.jsdelivr.net/gh/mahdi-sharifimehr/persian-fonts@master/BYekan/BYekan.ttf') format('truetype');
  font-weight: normal; font-style: normal; font-display: swap;
}
*{box-sizing:border-box;margin:0;padding:0}
::selection{background:rgba(14,116,144,.4);color:#fff}

:root{
  color-scheme:dark;
  --bg:#07080e;
  --surface:rgba(22,24,34,.6);
  --surface-solid:#141824;
  --surface-2:#1a1f2e;
  --surface-3:#232a3c;
  --border:rgba(255,255,255,.06);
  --border-2:rgba(255,255,255,.1);
  --border-strong:rgba(255,255,255,.2);
  --text:#f0f2f8;
  --text-secondary:#a0a8bd;
  --text-tertiary:#6b7385;
  --accent:#0e7490;
  --accent-2:#06b6d4;
  --accent-3:#22d3ee;
  --accent-soft:rgba(6,182,212,.14);
  --accent-glow:rgba(6,182,212,.5);
  --gold:#f59e0b;
  --gold-2:#fcd34d;
  --gold-soft:rgba(245,158,11,.14);
  --gold-glow:rgba(245,158,11,.5);
  --pink:#ec4899;
  --violet:#8b5cf6;
  --cyan:#22d3ee;
  --success:#22c55e;
  --warning:#f59e0b;
  --danger:#ef4444;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-2xl:24px;--r-full:999px;
  --shadow-sm:0 2px 8px rgba(0,0,0,.4);
  --shadow-md:0 8px 24px -8px rgba(0,0,0,.6);
  --shadow-lg:0 20px 48px -16px rgba(0,0,0,.7);
  --shadow-xl:0 32px 72px -24px rgba(0,0,0,.85);
  --ease-out:cubic-bezier(.2,.8,.3,1);
  --ease-spring:cubic-bezier(.34,1.4,.64,1);
  --ease-bounce:cubic-bezier(.68,-.55,.265,1.55);
  --dur-fast:140ms;--dur-base:220ms;--dur-slow:500ms;
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#eef2f9;
  --surface:rgba(255,255,255,.75);
  --surface-solid:#ffffff;
  --surface-2:#f4f7fc;
  --surface-3:#e8edf5;
  --border:rgba(15,23,42,.07);
  --border-2:rgba(15,23,42,.11);
  --border-strong:rgba(15,23,42,.2);
  --text:#0f172a;
  --text-secondary:#475569;
  --text-tertiary:#64748b;
  --accent-soft:rgba(6,182,212,.1);
  --shadow-sm:0 2px 8px rgba(15,23,42,.08);
  --shadow-md:0 8px 24px -8px rgba(15,23,42,.12);
  --shadow-lg:0 20px 48px -16px rgba(15,23,42,.16);
  --shadow-xl:0 32px 72px -24px rgba(15,23,42,.2);
}

html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{
  font-family:'BYekan', Tahoma, system-ui, sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background var(--dur-slow) var(--ease-out), color var(--dur-slow) var(--ease-out);
  overflow-x:hidden;position:relative;line-height:1.6;
}
b,strong,h1,h2,h3,h4,h5,h6{font-weight:normal}
button,input,textarea,select{font-family:inherit}

/* ═══════════════ ANIMATED BACKGROUND ═══════════════ */
.bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}

/* Mesh gradient orbs */
.bg-orb{position:absolute;border-radius:50%;filter:blur(110px);will-change:transform}
.bg-orb.o1{width:640px;height:640px;top:-240px;right:-180px;background:radial-gradient(circle, rgba(6,182,212,.55) 0%, transparent 68%);animation:orbDrift1 32s ease-in-out infinite}
.bg-orb.o2{width:540px;height:540px;bottom:-200px;left:-140px;background:radial-gradient(circle, rgba(245,158,11,.42) 0%, transparent 68%);animation:orbDrift2 38s ease-in-out infinite}
.bg-orb.o3{width:460px;height:460px;top:35%;left:45%;background:radial-gradient(circle, rgba(139,92,246,.35) 0%, transparent 70%);animation:orbDrift3 44s ease-in-out infinite}
.bg-orb.o4{width:380px;height:380px;top:15%;left:15%;background:radial-gradient(circle, rgba(236,72,153,.28) 0%, transparent 70%);animation:orbDrift1 50s ease-in-out infinite reverse}
[data-theme="light"] .bg-orb{opacity:.7}
@keyframes orbDrift1{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(-80px,90px) scale(1.15)}
  66%{transform:translate(60px,-70px) scale(.92)}
}
@keyframes orbDrift2{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(120px,-90px) scale(1.18)}
}
@keyframes orbDrift3{
  0%,100%{transform:translate(-50%,-50%) scale(1)}
  33%{transform:translate(-55%,-45%) scale(1.1)}
  66%{transform:translate(-45%,-55%) scale(.95)}
}

/* Floating particles */
.particles{position:absolute;inset:0;overflow:hidden}
.particle{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle, var(--c) 0%, transparent 70%);
  animation:particleFloat linear infinite;
  opacity:.6;
}
@keyframes particleFloat{
  0%{transform:translateY(100vh) translateX(0) scale(0);opacity:0}
  10%{opacity:.6}
  90%{opacity:.6}
  100%{transform:translateY(-20vh) translateX(60px) scale(1);opacity:0}
}

/* Grid pattern */
.bg-grid{
  position:absolute;inset:0;opacity:.03;
  background-image:
    linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);
  background-size:50px 50px;
  animation:gridMove 60s linear infinite;
}
[data-theme="light"] .bg-grid{opacity:.05;background-image:
  linear-gradient(rgba(15,23,42,.15) 1px, transparent 1px),
  linear-gradient(90deg, rgba(15,23,42,.15) 1px, transparent 1px);}
@keyframes gridMove{
  from{background-position:0 0}
  to{background-position:50px 50px}
}

/* ═══════════════ TOPBAR ═══════════════ */
.topbar{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px 32px;
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--border);
  animation:topbarIn .7s var(--ease-out) both;
}
@keyframes topbarIn{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}

.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;position:relative}
.brand-logo{
  width:44px;height:44px;flex-shrink:0;
  display:grid;place-items:center;border-radius:12px;
  position:relative;
  transition:transform var(--dur-slow) var(--ease-spring);
  animation:logoFloat 4s ease-in-out infinite;
}
.brand-logo svg{width:44px;height:44px;display:block;border-radius:12px;position:relative;z-index:2}
.brand-logo::before{
  content:'';position:absolute;inset:-4px;border-radius:16px;
  background:conic-gradient(from 0deg, var(--accent-2), var(--gold), var(--violet), var(--accent-2));
  opacity:0;filter:blur(10px);z-index:1;
  transition:opacity var(--dur-slow);
  animation:spinSlow 6s linear infinite;
}
.brand:hover .brand-logo::before{opacity:.9}
.brand:hover .brand-logo{transform:rotate(-8deg) scale(1.1)}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}

.brand-text h1{
  font-size:1rem;font-weight:bold;letter-spacing:-.3px;line-height:1.25;
  background:linear-gradient(120deg, var(--text), var(--accent-2), var(--gold), var(--text));
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:gradientText 6s ease-in-out infinite;
}
@keyframes gradientText{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.brand-text p{font-size:.66rem;color:var(--text-tertiary);margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:8px}

.status-pill{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.68rem;font-weight:bold;
  padding:6px 11px;border-radius:var(--r-full);
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-secondary);backdrop-filter:blur(12px);
}
.status-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--text-tertiary);position:relative}
.status-pill.online .dot{background:var(--success);box-shadow:0 0 10px var(--success)}
.status-pill.online .dot::after{
  content:'';position:absolute;inset:-3px;border-radius:50%;
  background:var(--success);opacity:.5;
  animation:pulseRing 2s ease-in-out infinite;
}
.status-pill.local .dot{background:var(--warning);box-shadow:0 0 10px var(--warning)}
@keyframes pulseRing{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(2);opacity:0}}

/* ═══════════════ BUTTONS with RIPPLE ═══════════════ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-size:.82rem;font-weight:bold;border:none;cursor:pointer;
  transition:all var(--dur-base) var(--ease-out);
  white-space:nowrap;letter-spacing:-.1px;text-decoration:none;
  position:relative;overflow:hidden;
}
.btn svg{width:15px;height:15px;flex-shrink:0;transition:transform var(--dur-base) var(--ease-spring)}
.btn:active{transform:scale(.96)}
.btn:hover svg{transform:scale(1.15) rotate(6deg)}

.btn-primary{
  color:#fff;padding:10px 18px;border-radius:var(--r-md);
  background:linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  background-size:200% 100%;
  box-shadow:0 8px 24px -8px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.22);
  animation:gradientShift 4s ease-in-out infinite;
}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.btn-primary::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg, transparent 40%, rgba(255,255,255,.35), transparent 60%);
  transform:translateX(-120%);transition:transform .8s var(--ease-out);
}
.btn-primary:hover::before{transform:translateX(120%)}
.btn-primary:hover{
  transform:translateY(-2px) scale(1.03);
  box-shadow:0 14px 32px -8px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.28);
}

.btn-ghost{
  background:transparent;color:var(--text-secondary);
  padding:9px 14px;border-radius:var(--r-md);border:1px solid var(--border);
}
.btn-ghost:hover{background:var(--surface-2);color:var(--text);transform:translateY(-1px)}

.icon-btn{
  width:38px;height:38px;flex-shrink:0;display:grid;place-items:center;
  border-radius:var(--r-md);background:var(--surface);border:1px solid var(--border);
  color:var(--text-secondary);cursor:pointer;
  transition:all var(--dur-base) var(--ease-out);backdrop-filter:blur(12px);
  position:relative;overflow:hidden;
}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--dur-base) var(--ease-spring)}
.icon-btn:hover{color:var(--text);border-color:var(--border-2);background:var(--surface-2);transform:translateY(-2px)}
.icon-btn:hover svg{transform:rotate(12deg) scale(1.15)}
.icon-btn.lock-on{
  color:var(--success);
  border-color:color-mix(in srgb, var(--success) 40%, transparent);
  background:color-mix(in srgb, var(--success) 10%, transparent);
}
.icon-btn.lock-on::after{
  content:'';position:absolute;top:-2px;inset-inline-end:-2px;
  width:9px;height:9px;border-radius:50%;background:var(--success);
  border:2px solid var(--bg);box-shadow:0 0 10px var(--success);
  animation:livePulse 2.4s infinite;
}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.2)}}

.install-btn{
  display:none;align-items:center;gap:6px;
  font-size:.8rem;font-weight:bold;color:var(--accent-3);
  background:var(--accent-soft);
  border:1px solid color-mix(in srgb, var(--accent-3) 35%, transparent);
  padding:9px 14px;border-radius:var(--r-md);cursor:pointer;
  transition:all var(--dur-base) var(--ease-out);
  position:relative;overflow:hidden;
}
.install-btn:hover{background:color-mix(in srgb, var(--accent-3) 20%, transparent);transform:translateY(-1px)}
.install-btn.show{display:inline-flex;animation:popIn var(--dur-slow) var(--ease-spring) both}
.install-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@keyframes popIn{from{opacity:0;transform:scale(.5) rotate(-20deg)}to{opacity:1;transform:none}}

/* ═══════════════ MAIN ═══════════════ */
main{position:relative;z-index:10;max-width:800px;margin:0 auto;padding:80px 24px 120px;min-height:calc(100vh - 65px)}

.hero{text-align:center;margin-bottom:44px}
.hero h2{
  font-size:clamp(1.5rem,4vw,2.1rem);
  font-weight:bold;letter-spacing:-.8px;line-height:1.4;
  margin-bottom:32px;
  background:linear-gradient(120deg, var(--text) 0%, var(--accent-3) 35%, var(--gold) 70%, var(--text) 100%);
  background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:gradientText 8s ease-in-out infinite, heroIn .9s var(--ease-spring) .1s both;
}
@keyframes heroIn{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:none}}

/* Typing cursor */
.type-cursor{
  display:inline-block;width:3px;height:1em;
  background:var(--accent-3);margin-inline-start:4px;
  vertical-align:middle;
  animation:cursorBlink 1s step-end infinite;
}
@keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}

/* ═══════════════ SEARCH ═══════════════ */
.search-wrap{
  position:relative;max-width:680px;margin:0 auto;
  animation:searchIn .8s var(--ease-spring) .2s both;
}
@keyframes searchIn{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}

.search-box{
  display:flex;align-items:center;gap:11px;
  padding:5px 20px;border-radius:var(--r-xl);
  background:var(--surface-solid);
  border:1.5px solid var(--border-2);
  transition:border-color var(--dur-fast), box-shadow var(--dur-fast), transform var(--dur-fast);
  box-shadow:var(--shadow-md);
  position:relative;overflow:hidden;
}
.search-box::before{
  content:'';position:absolute;inset:-1px;
  border-radius:var(--r-xl);
  background:conic-gradient(from 0deg, var(--accent-2), var(--gold), var(--violet), var(--pink), var(--accent-2));
  opacity:0;z-index:-1;
  transition:opacity var(--dur-slow);
  animation:spinSlow 4s linear infinite;
}
.search-box:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.search-box.focused{
  border-color:transparent;
  box-shadow:var(--shadow-lg), 0 0 0 4px var(--accent-soft);
  transform:translateY(-3px) scale(1.01);
}
.search-box.focused::before{opacity:.9}
.search-box .ico{
  width:19px;height:19px;flex-shrink:0;
  stroke:var(--text-tertiary);fill:none;stroke-width:2.2;
  stroke-linecap:round;transition:stroke var(--dur-fast), transform var(--dur-base);
}
.search-box.focused .ico{stroke:var(--accent-3);transform:scale(1.15)}
.search-box input{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--text);font-size:1rem;padding:17px 0;min-width:0;
}
.search-box input::placeholder{color:var(--text-tertiary)}
.kbd-hint{display:inline-flex;gap:3px;flex-shrink:0}
.kbd-hint kbd{
  font-size:.64rem;font-weight:bold;padding:3px 6px;border-radius:6px;
  background:var(--surface-2);color:var(--text-tertiary);
  border:1px solid var(--border);
}
.search-box.focused .kbd-hint{display:none}
.clear-search{
  width:26px;height:26px;flex-shrink:0;
  display:none;place-items:center;
  border-radius:var(--r-sm);border:none;
  background:var(--surface-2);color:var(--text-tertiary);
  cursor:pointer;font-size:1rem;line-height:1;
  transition:all var(--dur-fast);
}
.clear-search:hover{background:var(--danger);color:#fff;transform:rotate(90deg) scale(1.15)}
.clear-search.show{display:grid;animation:popIn .3s var(--ease-spring)}

/* ═══════════════ DROPDOWN ═══════════════ */
.dropdown{
  position:absolute;top:calc(100% + 10px);left:0;right:0;
  display:none;flex-direction:column;
  background:var(--surface-solid);
  border:1px solid var(--border-2);
  border-radius:var(--r-xl);
  box-shadow:var(--shadow-xl);
  overflow:hidden;z-index:70;
  max-height:min(72vh,640px);
}
.dropdown.show{
  display:flex;
  animation:ddIn .25s var(--ease-spring) both;
}
@keyframes ddIn{
  from{opacity:0;transform:translateY(-8px) scale(.98)}
  to{opacity:1;transform:none}
}
.dd-filter{
  display:flex;align-items:center;gap:6px;
  padding:12px 14px;border-bottom:1px solid var(--border);
  overflow-x:auto;flex-shrink:0;scrollbar-width:none;
}
.dd-filter::-webkit-scrollbar{display:none}
.fchip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.72rem;font-weight:bold;
  padding:6px 11px;border-radius:var(--r-full);
  background:transparent;color:var(--text-tertiary);
  border:1px solid var(--border-2);
  cursor:pointer;white-space:nowrap;
  transition:all var(--dur-base) var(--ease-out);
}
.fchip:hover{color:var(--text);border-color:var(--border-strong);background:var(--surface-2);transform:translateY(-2px)}
.fchip.active{
  background:linear-gradient(135deg, var(--accent), var(--accent-2));
  color:#fff;border-color:transparent;
  box-shadow:0 4px 16px -4px var(--accent-glow);
  transform:translateY(-2px);
}
.fchip .n{font-size:.62rem;padding:1px 6px;border-radius:var(--r-full);background:rgba(255,255,255,.14)}
.fchip.active .n{background:rgba(255,255,255,.24)}
.dd-body{overflow-y:auto;flex:1;padding:6px}

.res{
  position:relative;display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:var(--r-md);
  cursor:pointer;
  transition:background var(--dur-fast), transform var(--dur-fast);
  animation:resIn .4s var(--ease-spring) both;
}
@keyframes resIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.res:hover,.res.kbd-focus{background:var(--surface-2);transform:translateX(-3px)}
.res.kbd-focus{box-shadow:inset 3px 0 0 var(--accent-3)}
.res + .res{margin-top:1px}
.res-ico{
  width:42px;height:42px;flex-shrink:0;
  display:grid;place-items:center;border-radius:var(--r-md);
  background:color-mix(in srgb, var(--fc) 15%, transparent);
  border:1px solid color-mix(in srgb, var(--fc) 26%, transparent);
  transition:transform var(--dur-base) var(--ease-spring);
}
.res:hover .res-ico{transform:scale(1.1) rotate(-6deg)}
.res-ico svg{width:20px;height:20px;stroke:var(--fc);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.res-body{flex:1;min-width:0}
.res-name{font-size:.88rem;font-weight:bold;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-name mark{background:transparent;color:var(--accent-3);font-weight:bold;text-shadow:0 0 12px var(--accent-glow)}
.res-meta{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:.68rem;color:var(--text-tertiary)}
.res-meta .sep{opacity:.4}
.res-acts{display:flex;gap:2px;flex-shrink:0;opacity:0;transition:opacity var(--dur-fast)}
.res:hover .res-acts,.res.kbd-focus .res-acts{opacity:1}
.res-act{
  width:32px;height:32px;display:grid;place-items:center;
  border-radius:var(--r-sm);border:none;background:transparent;
  color:var(--text-tertiary);cursor:pointer;
  transition:all var(--dur-base) var(--ease-spring);
}
.res-act:hover{background:var(--surface-3);color:var(--text);transform:scale(1.2) translateY(-2px)}
.res-act svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.res-act.pv:hover{color:var(--accent-3)}
.res-act.dl:hover{color:var(--success)}
.res-act.pr:hover{color:var(--gold)}
.res-act.rm:hover{color:var(--danger)}

.dd-empty{padding:48px 24px;text-align:center;color:var(--text-tertiary);animation:resIn .4s both}
.dd-empty .ic{
  width:56px;height:56px;margin:0 auto 14px;border-radius:var(--r-lg);
  background:var(--surface-2);border:1px solid var(--border);
  display:grid;place-items:center;
  animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.dd-empty .ic svg{width:26px;height:26px;stroke:var(--text-tertiary);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dd-empty p{font-size:.85rem}
.dd-section-title{padding:8px 14px 6px;font-size:.66rem;font-weight:bold;color:var(--text-tertiary);letter-spacing:.4px}
.recent-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:var(--r-md);
  cursor:pointer;font-size:.85rem;
  color:var(--text-secondary);
  transition:all var(--dur-fast);
}
.recent-item:hover{background:var(--surface-2);color:var(--text);transform:translateX(-3px)}
.recent-item svg{width:15px;height:15px;stroke:var(--text-tertiary);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.recent-item .x{
  margin-inline-start:auto;width:22px;height:22px;
  display:grid;place-items:center;border-radius:var(--r-sm);
  background:transparent;border:none;color:var(--text-tertiary);
  cursor:pointer;font-size:.9rem;
}
.recent-item .x:hover{background:var(--danger);color:#fff;transform:rotate(90deg)}

/* ═══════════════ MODALS ═══════════════ */
.overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(6,8,16,.75);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:none;place-items:center;padding:20px;overflow-y:auto;
}
.overlay.open{display:grid;animation:fade var(--dur-base) var(--ease-out)}
.overlay.high{z-index:200}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:560px;
  background:var(--surface-solid);
  border:1px solid var(--border-2);
  border-radius:var(--r-2xl);
  box-shadow:var(--shadow-xl);
  overflow:hidden;margin:auto;
  animation:modalIn .5s var(--ease-spring) both;
  position:relative;
}
.modal::before{
  content:'';position:absolute;inset:0;
  border-radius:var(--r-2xl);
  padding:1px;
  background:linear-gradient(135deg, var(--accent-2), var(--gold), var(--violet), var(--accent-2));
  background-size:300% 300%;
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  opacity:.4;
  animation:gradientShift 6s ease-in-out infinite;
  pointer-events:none;
}
.modal.wide{max-width:1100px}
.modal.small{max-width:420px}
@keyframes modalIn{
  from{opacity:0;transform:scale(.85) translateY(30px)}
  to{opacity:1;transform:none}
}
.m-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:20px 22px;border-bottom:1px solid var(--border);
  position:relative;z-index:1;
}
.m-head h3{font-size:1.05rem;font-weight:bold;letter-spacing:-.2px}
.m-head p{font-size:.74rem;color:var(--text-tertiary);margin-top:4px}
.m-close{
  width:34px;height:34px;flex-shrink:0;
  display:grid;place-items:center;
  border-radius:var(--r-sm);border:1px solid var(--border);
  background:transparent;color:var(--text-tertiary);
  cursor:pointer;font-size:1.15rem;line-height:1;
  transition:all var(--dur-base) var(--ease-spring);
}
.m-close:hover{color:#fff;background:var(--danger);border-color:transparent;transform:rotate(90deg) scale(1.1)}
.m-body{padding:20px 22px;max-height:70vh;overflow-y:auto;position:relative;z-index:1}
.m-foot{
  display:flex;gap:10px;padding:16px 22px;
  border-top:1px solid var(--border);
  background:var(--surface-2);
  position:relative;z-index:1;
}
.m-foot .btn{flex:1;padding:11px;font-size:.85rem;border-radius:var(--r-md)}
.m-foot .btn-primary{flex:2}

/* Mode toggle */
.mode-toggle{
  display:flex;gap:4px;margin-bottom:16px;padding:4px;
  border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--border);
}
.mode-toggle button{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:10px;border-radius:var(--r-sm);border:none;
  background:transparent;color:var(--text-tertiary);
  cursor:pointer;font-size:.78rem;font-weight:bold;
  transition:all var(--dur-base) var(--ease-out);
}
.mode-toggle button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mode-toggle button.active{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
  box-shadow:0 6px 20px -6px var(--accent-glow);
}

/* Drop zone */
.drop-zone{
  border:2px dashed var(--border-strong);
  border-radius:var(--r-lg);padding:40px 22px;
  text-align:center;cursor:pointer;
  background:var(--surface-2);
  transition:all var(--dur-base) var(--ease-out);
  position:relative;overflow:hidden;
}
.drop-zone::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 50%, var(--accent-soft), transparent 70%);
  opacity:0;transition:opacity var(--dur-slow);
}
.drop-zone:hover,.drop-zone.over{
  border-color:var(--accent-2);
  background:color-mix(in srgb, var(--accent-2) 6%, var(--surface-2));
  transform:scale(1.01);
}
.drop-zone:hover::before,.drop-zone.over::before{opacity:1}
.drop-zone.over{transform:scale(1.03);border-style:solid}
.drop-zone svg{
  width:42px;height:42px;margin-bottom:12px;
  stroke:var(--accent-2);fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;
  transition:transform var(--dur-slow) var(--ease-spring);
  position:relative;z-index:1;
}
.drop-zone:hover svg{transform:translateY(-8px) scale(1.15);animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(-8px) scale(1.15)}50%{transform:translateY(-14px) scale(1.18)}}
.drop-zone h4{font-size:.95rem;font-weight:bold;margin-bottom:6px;position:relative;z-index:1}
.drop-zone p{font-size:.76rem;color:var(--text-tertiary);line-height:1.85;position:relative;z-index:1}
.formats{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:14px;position:relative;z-index:1}
.formats span{
  font-size:.6rem;font-weight:bold;letter-spacing:.4px;
  padding:3px 8px;border-radius:var(--r-sm);
  background:var(--surface-3);color:var(--text-tertiary);
  border:1px solid var(--border);
  transition:all var(--dur-fast);
}
.formats span:hover{background:var(--accent-soft);color:var(--accent-3);border-color:var(--accent-3);transform:translateY(-2px)}

/* Pending files */
.pending{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.p-item{
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:11px;
  padding:12px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--border);
  animation:pItemIn .5s var(--ease-spring) both;
}
@keyframes pItemIn{from{opacity:0;transform:translateX(-20px) scale(.9)}to{opacity:1;transform:none}}
.p-item.done{border-color:color-mix(in srgb, var(--success) 40%, transparent)}
.p-item.done::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--success) 20%, transparent));
  animation:flash .9s forwards;
}
.p-item.failed{background:color-mix(in srgb, var(--danger) 8%, var(--surface-2));border-color:color-mix(in srgb, var(--danger) 35%, transparent)}
.p-item.duplicate{background:color-mix(in srgb, var(--warning) 8%, var(--surface-2));border-color:color-mix(in srgb, var(--warning) 40%, transparent)}
@keyframes flash{to{opacity:0}}
.p-ico{
  width:40px;height:40px;flex-shrink:0;
  display:grid;place-items:center;border-radius:var(--r-md);
  background:color-mix(in srgb, var(--fc) 16%, transparent);
  border:1px solid color-mix(in srgb, var(--fc) 28%, transparent);
  transition:transform var(--dur-base) var(--ease-spring);
}
.p-item:hover .p-ico{transform:scale(1.1) rotate(6deg)}
.p-ico svg{width:19px;height:19px;stroke:var(--fc);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.p-info{flex:1;min-width:0}
.p-info input{
  width:100%;background:var(--surface-3);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:9px 11px;color:var(--text);
  font-size:.85rem;outline:none;
  transition:all var(--dur-fast);
}
.p-info input:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
.p-info input:disabled{opacity:.6;cursor:not-allowed}
.p-meta{font-size:.66rem;color:var(--text-tertiary);margin-top:5px}
.p-err{font-size:.68rem;color:var(--danger);margin-top:5px;font-weight:bold}
.p-warn{font-size:.68rem;color:var(--warning);margin-top:5px;font-weight:bold}
.rm-p{
  width:30px;height:30px;flex-shrink:0;
  display:grid;place-items:center;
  border-radius:var(--r-sm);border:none;background:transparent;
  color:var(--text-tertiary);cursor:pointer;
  transition:all var(--dur-base) var(--ease-spring);
}
.rm-p:hover{background:var(--danger);color:#fff;transform:rotate(90deg) scale(1.1)}
.rm-p svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

/* Progress ring */
.progress{
  margin-top:14px;padding:16px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--border);
  animation:pItemIn .4s var(--ease-spring) both;
  display:flex;align-items:center;gap:16px;
}
.p-ring{
  width:56px;height:56px;flex-shrink:0;
  position:relative;
}
.p-ring svg{transform:rotate(-90deg);width:56px;height:56px}
.p-ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.p-ring .bg-c{stroke:var(--surface-3)}
.p-ring .fg-c{
  stroke:url(#ringGrad);
  transition:stroke-dashoffset var(--dur-slow) var(--ease-out);
}
.p-ring-txt{
  position:absolute;inset:0;
  display:grid;place-items:center;
  font-size:.72rem;font-weight:bold;color:var(--accent-3);
}
.p-body{flex:1;min-width:0}
.p-top{font-size:.8rem;color:var(--text-secondary);margin-bottom:4px;font-weight:bold}
.p-name{font-size:.7rem;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Login */
.login-head{display:flex;align-items:center;gap:13px}
.login-ico{
  width:48px;height:48px;flex-shrink:0;
  display:grid;place-items:center;border-radius:var(--r-md);
  background:linear-gradient(135deg, rgba(6,182,212,.22), rgba(245,158,11,.15));
  border:1px solid color-mix(in srgb, var(--accent-2) 35%, transparent);
  animation:float 3s ease-in-out infinite;
}
.login-ico svg{width:22px;height:22px;stroke:var(--accent-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pw-field{position:relative;margin-bottom:12px}
.pw-field input{
  width:100%;background:var(--surface-2);
  border:1.5px solid var(--border-2);
  border-radius:var(--r-md);
  padding:15px 48px 15px 15px;
  color:var(--text);font-size:1rem;font-weight:bold;
  outline:none;transition:all var(--dur-fast);
  letter-spacing:3px;text-align:center;
}
.pw-field input:focus{border-color:var(--accent-2);box-shadow:0 0 0 4px var(--accent-soft);transform:scale(1.01)}
.pw-field input.shake{animation:shake .5s var(--ease-out)}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-12px) rotate(-2deg)}
  30%{transform:translateX(12px) rotate(2deg)}
  45%{transform:translateX(-9px) rotate(-1deg)}
  60%{transform:translateX(9px) rotate(1deg)}
  75%{transform:translateX(-4px)}
}
.pw-eye{
  position:absolute;top:50%;inset-inline-end:8px;
  transform:translateY(-50%);
  width:36px;height:36px;display:grid;place-items:center;
  border-radius:var(--r-sm);border:none;background:transparent;
  color:var(--text-tertiary);cursor:pointer;
  transition:all var(--dur-fast);
}
.pw-eye:hover{background:var(--surface-3);color:var(--text)}
.pw-eye svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pw-error{
  display:none;padding:11px 14px;border-radius:var(--r-md);
  font-size:.8rem;font-weight:bold;
  background:rgba(239,68,68,.12);
  border:1px solid rgba(239,68,68,.35);
  color:#fca5a5;text-align:center;
}
.pw-error.show{display:block;animation:shake .5s var(--ease-out)}
.pw-hint{font-size:.72rem;color:var(--text-tertiary);text-align:center;margin-top:14px}

/* Preview */
.prev-frame{width:100%;height:76vh;border:none;border-radius:var(--r-md);background:#3a3d42;display:block}
.prev-img{max-width:100%;max-height:76vh;border-radius:var(--r-md);display:block;margin:0 auto;animation:modalIn .5s var(--ease-spring)}
.prev-load{padding:60px 24px;text-align:center;color:var(--text-tertiary)}
.prev-load .spinner{
  width:44px;height:44px;margin:0 auto 16px;border-radius:50%;
  border:3px solid var(--border-2);border-top-color:var(--accent-3);
  animation:spin 900ms linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.prev-unsup{text-align:center;padding:50px 22px}
.prev-unsup .ic{
  width:80px;height:80px;margin:0 auto 18px;
  border-radius:24px;background:var(--surface-2);
  border:1px solid var(--border);
  display:grid;place-items:center;
  animation:float 3s ease-in-out infinite;
}
.prev-unsup .ic svg{width:36px;height:36px;stroke:var(--fc);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.prev-unsup h4{font-size:1rem;font-weight:bold;margin-bottom:8px}
.prev-unsup p{color:var(--text-tertiary);font-size:.82rem;line-height:1.9;margin-bottom:18px;max-width:380px;margin-inline:auto}
.prev-text{
  background:var(--surface-2);padding:20px;border-radius:var(--r-md);
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:.82rem;line-height:1.9;white-space:pre-wrap;
  word-break:break-word;max-height:76vh;overflow-y:auto;
  border:1px solid var(--border);direction:ltr;text-align:left;
}

/* Confirm */
.confirm-body{padding:26px 22px;text-align:center}
.confirm-ico{
  width:72px;height:72px;margin:0 auto 16px;
  border-radius:20px;
  background:rgba(239,68,68,.12);
  border:1px solid rgba(239,68,68,.32);
  display:grid;place-items:center;
  animation:popIn .5s var(--ease-spring) both;
}
.confirm-ico svg{width:32px;height:32px;stroke:var(--danger);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.confirm-ico.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent-2) 32%,transparent)}
.confirm-ico.info svg{stroke:var(--accent-3)}
.confirm-body h4{font-size:1.05rem;font-weight:bold;margin-bottom:8px}
.confirm-body p{font-size:.84rem;color:var(--text-tertiary);line-height:1.9}
.confirm-body p b{color:var(--text);font-weight:bold}

/* Toast */
.toast-wrap{position:fixed;bottom:24px;inset-inline-end:24px;z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:10px;
  padding:13px 18px;border-radius:var(--r-md);
  font-size:.83rem;font-weight:bold;
  background:var(--surface-solid);
  border:1px solid var(--border-2);
  box-shadow:var(--shadow-lg);
  animation:toastIn .5s var(--ease-spring) both;
  min-width:220px;max-width:360px;pointer-events:auto;
}
.toast.out{animation:toastOut .3s var(--ease-out) forwards}
@keyframes toastIn{
  from{opacity:0;transform:translateX(80px) scale(.8) rotate(10deg)}
  to{opacity:1;transform:none}
}
@keyframes toastOut{to{opacity:0;transform:translateX(80px) scale(.8)}}
.toast svg{width:17px;height:17px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.toast.ok{color:var(--success)}
.toast.err{color:var(--danger)}
.toast.info{color:var(--accent-3)}
.toast.warn{color:var(--warning)}
.toast span{color:var(--text);font-weight:normal}

/* ═══════════════ SPECIAL EFFECTS ═══════════════ */
/* Confetti */
.confetti{
  position:fixed;top:0;left:0;width:10px;height:10px;
  z-index:9999;pointer-events:none;
  animation:confettiFall 2.5s linear forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}

/* Ripple */
.ripple{
  position:absolute;border-radius:50%;
  background:rgba(255,255,255,.5);
  transform:scale(0);
  animation:rippleAnim .6s ease-out;
  pointer-events:none;
}
@keyframes rippleAnim{
  to{transform:scale(4);opacity:0}
}

/* Scrollbar */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg, var(--accent), var(--accent-2));
  border-radius:100px;border:2px solid var(--bg);
}

/* Responsive */
@media(max-width:860px){
  .topbar{padding:10px 14px}
  .brand-text p{display:none}
  .brand-text h1{font-size:.9rem}
  .brand-logo{width:38px;height:38px}
  .brand-logo svg{width:38px;height:38px}
  .status-pill{display:none}
  .install-btn span{display:none}
  .install-btn{padding:9px 11px}
  main{padding:48px 16px 100px}
  .btn-primary span{display:none}
  .btn-primary{padding:10px 14px}
  .hero h2{letter-spacing:-.5px;margin-bottom:24px}
  .kbd-hint{display:none}
  .dropdown{max-height:62vh}
  .res-acts{opacity:1}
  .modal{max-width:100%;border-radius:var(--r-xl)}
  .m-head,.m-body,.m-foot{padding-inline:16px}
  .m-body{max-height:60vh}
  .toast-wrap{inset-inline-end:12px;inset-inline-start:12px;bottom:12px}
  .toast{min-width:auto;max-width:100%}
  .prev-frame,.prev-img{height:58vh;max-height:58vh}
  .bg-orb{filter:blur(70px)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .bg-orb,.particle{animation:none}
}
</style>
</head>
<body>

<!-- Background -->
<div class="bg-layer">
  <div class="bg-orb o1"></div>
  <div class="bg-orb o2"></div>
  <div class="bg-orb o3"></div>
  <div class="bg-orb o4"></div>
  <div class="bg-grid"></div>
  <div class="particles" id="particles"></div>
</div>

<!-- SVG Gradient Defs -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
</svg>

<header class="topbar">
  <a class="brand" href="#" onclick="event.preventDefault()">
    <div class="brand-logo" id="brandLogo"></div>
    <div class="brand-text">
      <h1>سی تک پارسیان</h1>
      <p>جعبه ابزار کفپوش</p>
    </div>
  </a>
  <div class="topbar-right">
    <span class="status-pill" id="statusPill">
      <span class="dot"></span>
      <span id="statusText">…</span>
    </span>
    <button class="install-btn" id="installBtn" title="نصب روی ویندوز">
      <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M6 11l6 6 6-6"/><path d="M4 21h16"/></svg>
      <span>نصب اپ</span>
    </button>
    <button class="btn btn-primary" id="uploadBtn" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>افزودن فرم</span>
    </button>
    <button class="icon-btn" id="lockBtn" title="ورود مدیر"></button>
    <button class="icon-btn" id="themeBtn" title="تغییر تم"></button>
  </div>
</header>

<main>
  <section class="hero">
    <h2 id="heroText"><span id="typedText"></span><span class="type-cursor"></span></h2>
    <div class="search-wrap">
      <div class="search-box" id="searchBox">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>

/* ══════════════════════════════════════════════════════════════════
   🔐 SHA-256 hash for duplicate detection
   ══════════════════════════════════════════════════════════════════ */
async function fileHash(file){
  try{
    const buf = await file.arrayBuffer();
    const hashBuf = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }catch(e){
    return null;
  }
}

/* IndexedDB */
const DB_NAME = 'formban-db', STORE = 'forms';
let dbPromise = null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath:'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbPromise;
}
async function idbAll(){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readonly');
    const r = tx.objectStore(STORE).getAll();
    r.onsuccess = () => res(r.result || []);
    r.onerror = () => rej(r.error);
  });
}
async function idbPut(rec){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(rec);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function idbDel(id){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(id){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readonly');
    const r = tx.objectStore(STORE).get(id);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}

async function fetchAllForms(){
  if(state.connected && sb){
    const { data, error } = await sb.from(SUPABASE_CONFIG.table).select('*').order('created_at', { ascending:false });
    if(error) throw error;
    return (data || []).map(r => ({
      id:r.id, name:r.name, size:r.file_size||0,
      createdAt:new Date(r.created_at).getTime(),
      type:r.file_type, path:r.file_path, remote:true,
    }));
  }
  const local = await idbAll();
  return local.map(r => ({
    id:r.id, name:r.name, size:r.size, createdAt:r.createdAt,
    type:r.blob?.type || r.type, blob:r.blob, remote:false,
  }));
}
async function uploadForm(file, name){
  const hash = await fileHash(file);
  if(state.connected && sb){
    const id = rnd();
    const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
    const path = `${id}.${ext}`;
    const { error: upErr } = await sb.storage.from(SUPABASE_CONFIG.bucket)
      .upload(path, file, { cacheControl:'3600', upsert:false, contentType:file.type||'application/octet-stream' });
    if(upErr) throw new Error(`Storage: ${upErr.message}`);
    const { error: dbErr } = await sb.from(SUPABASE_CONFIG.table)
      .insert({ id, name, file_path:path, file_type:file.type||'', file_size:file.size });
    if(dbErr){
      try{ await sb.storage.from(SUPABASE_CONFIG.bucket).remove([path]); }catch(e){}
      throw new Error(`Table: ${dbErr.message}`);
    }
    if(hash) saveHash(hash);
    return { id, name, size:file.size, createdAt:Date.now(), type:file.type, path, remote:true };
  }
  const rec = { id:rnd(), name, blob:file, size:file.size, createdAt:Date.now(), type:file.type };
  await idbPut(rec);
  if(hash) saveHash(hash);
  return { ...rec, remote:false };
}
function saveHash(hash){
  state.hashes.push(hash);
  state.hashes = state.hashes.slice(-500);
  localStorage.setItem('formban-hashes', JSON.stringify(state.hashes));
}
async function deleteFormRecord(form){
  if(form.remote && state.connected && sb){
    if(form.path) await sb.storage.from(SUPABASE_CONFIG.bucket).remove([form.path]);
    const { error } = await sb.from(SUPABASE_CONFIG.table).delete().eq('id', form.id);
    if(error) throw error;
    return;
  }
  await idbDel(form.id);
}
async function getFormBlob(form){
  if(form.remote && state.connected && sb){
    const { data, error } = await sb.storage.from(SUPABASE_CONFIG.bucket).download(form.path);
    if(error) throw error;
    return data;
  }
  if(form.blob) return form.blob;
  const rec = await idbGet(form.id);
  return rec?.blob || null;
}
async function getFormUrl(form){
  if(form.remote && state.connected && sb){
    const { data } = sb.storage.from(SUPABASE_CONFIG.bucket).getPublicUrl(form.path);
    return data?.publicUrl || null;
  }
  const b = await getFormBlob(form);
  return b ? URL.createObjectURL(b) : null;
}

/* Confirm */
const confirmModal = $('#confirmModal');
let confirmResolve = null;
function confirmDialog(title, text, okLabel='تأیید', isInfo=false){
  return new Promise(resolve => {
    $('#confirmTitle').textContent = title;
    $('#confirmText').innerHTML = text;
    $('#confirmOk').textContent = okLabel;
    $('#confirmIco').classList.toggle('info', isInfo);
    const okBtn = $('#confirmOk');

      okBtn.style.background = 'linear-gradient(135deg,var(--accent),var(--accent-2))';

    }
    confirmModal.classList.add('open');
    document.body.style.overflow = 'hidden';
    confirmResolve = resolve;
  });
}
function resolveConfirm(val){
  confirmModal.classList.remove('open');
  document.body.style.overflow = '';
  if(confirmResolve){ confirmResolve(val); confirmResolve = null; }
}
$('#confirmCancel').addEventListener('click', () => resolveConfirm(false));

/* Search */
const searchInput = $('#search');
const searchBox = $('#searchBox');
const dropdown = $('#dropdown');

function highlight(text, q){
  if(!q) return esc(text);
  const re = new RegExp('(' + escapeRegex(q) + ')', 'gi');
  return esc(text).replace(re, '<mark>$1</mark>');
}
function matchScore(name, q){
  const n = name.toLowerCase(), Q = q.toLowerCase();
  const idx = n.indexOf(Q);
  if(idx === -1) return -1;
  if(n === Q) return 0;
  if(n.startsWith(Q)) return 1;
  return 2 + idx/100 + name.length/10000;
}
function getResults(){
  const q = state.search.trim();
  if(!q) return [];
  let pool = state.forms;
  if(state.filter !== 'all') pool = pool.filter(f => fileKind(f.name, f.type).cat === state.filter);
  return pool.map(f => ({ form:f, score:matchScore(f.name, q) }))
    .filter(x => x.score >= 0)
    .sort((a,b) => a.score - b.score)
    .map(x => x.form);
}
function saveRecent(q){
  if(!q || q.length < 2) return;
  state.recent = state.recent.filter(r => r !== q);
  state.recent.unshift(q);
  state.recent = state.recent.slice(0, 5);
  localStorage.setItem('formban-recent', JSON.stringify(state.recent));
}
function removeRecent(q){
  state.recent = state.recent.filter(r => r !== q);
  localStorage.setItem('formban-recent', JSON.stringify(state.recent));
  renderDropdown();
}
function countByCat(cat){
  if(cat === 'all') return state.forms.length;
  return state.forms.filter(f => fileKind(f.name, f.type).cat === cat).length;
}

const FILTER_DEFS = [
  { id:'all', label:'همه' },
  { id:'pdf', label:'PDF' },
  { id:'word', label:'Word' },
  { id:'excel', label:'Excel' },
  { id:'image', label:'تصاویر' },
  { id:'text', label:'متنی' },
];
function renderFilterBar(){
  const html = FILTER_DEFS.map(f => {
    const n = countByCat(f.id);
    if(f.id !== 'all' && n === 0) return '';
    return `<button class="fchip ${state.filter===f.id?'active':''}" data-filter="${f.id}" type="button">
      ${f.label} ${n ? `<span class="n">${fa(n)}</span>` : ''}
    </button>`;
  }).join('');
  $('#ddFilter').innerHTML = html;
}
$('#ddFilter').addEventListener('click', e => {
  const btn = e.target.closest('[data-filter]');
  if(!btn) return;
  state.filter = btn.dataset.filter;
  state.kbdIndex = -1;
  renderDropdown();
});

function renderDropdown(){
  const q = state.search.trim();
  if(!q){
    if(state.recent.length){
      dropdown.classList.add('show');
      $('#ddFilter').innerHTML = '';
      $('#ddBody').innerHTML = `
        <div class="dd-section-title">جستجوهای اخیر</div>
        ${state.recent.map(r => `
          <div class="recent-item" data-recent="${esc(r)}">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <span>${esc(r)}</span>
            <button class="x" data-remove="${esc(r)}" type="button">×</button>
          </div>`).join('')}`;
    } else {
      dropdown.classList.remove('show');
    }
    return;
  }
  dropdown.classList.add('show');
  renderFilterBar();
  const results = getResults();
  if(!results.length){
    $('#ddBody').innerHTML = `
      <div class="dd-empty">
        <div class="ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/><path d="M8 11h6"/></svg></div>
        <p>فرمی با این اسم پیدا نشد</p>
      </div>`;
    return;
  }
  $('#ddBody').innerHTML = results.map((form, i) => {
    const kind = fileKind(form.name, form.type);
    const delBtn = state.isAdmin ? `
      <button class="res-act rm" data-act="delete" title="حذف" type="button">
        <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
      </button>` : '';
    return `
      <div class="res" data-id="${form.id}" data-idx="${i}" style="animation-delay:${i*30}ms">
        <div class="res-ico" style="--fc:${kind.color}">
          <svg viewBox="0 0 24 24">${GLYPHS[kind.glyph] || GLYPHS.file}</svg>
        </div>
        <div class="res-body">
          <div class="res-name">${highlight(form.name, q)}</div>
          <div class="res-meta">
            <span>${kind.label}</span><span class="sep">•</span>
            <span>${fmtSize(form.size)}</span><span class="sep">•</span>
            <span>${fmtDateShort(form.createdAt)}</span>
          </div>
        </div>
        <div class="res-acts">
          <button class="res-act pv" data-act="preview" title="نمایش" type="button"><svg viewBox="0 0 24 24"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <button class="res-act dl" data-act="download" title="دانلود" type="button"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg></button>
          <button class="res-act pr" data-act="print" title="چاپ" type="button"><svg viewBox="0 0 24 24"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><path d="M6 14h12v8H6z"/></svg></button>
          ${delBtn}
        </div>
      </div>`;
  }).join('');
}

function render(){
  renderStatus();
  renderLock();
  renderDropdown();
}

  const rec = e.target.closest('[data-recent]');

$('#ddBody').addEventListener('click', e => {
  const item = e.target.closest('.res');
  if(!item) return;
  const form = state.forms.find(f => f.id === item.dataset.id);
  if(!form) return;
  const act = e.target.closest('[data-act]');
  if(act){
    e.stopPropagation();
    const a = act.dataset.act;
    if(a === 'preview') previewForm(form);
    else if(a === 'download') downloadForm(form);
    else if(a === 'print') printForm(form);
    else if(a === 'delete') deleteForm(form);
    return;
  }
  saveRecent(state.search.trim());
  previewForm(form);
});

document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    searchInput.focus(); searchInput.select();
    return;
  }
  if(!dropdown.classList.contains('show')) return;
  const items = $$('.res, .recent-item');
  if(!items.length) return;
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    state.kbdIndex = (state.kbdIndex + 1) % items.length;
    updateKbdFocus(items);
  } else if(e.key === 'ArrowUp'){
    e.preventDefault();
    state.kbdIndex = state.kbdIndex <= 0 ? items.length - 1 : state.kbdIndex - 1;
    updateKbdFocus(items);
  } else if(e.key === 'Enter'){
    if(state.kbdIndex >= 0 && items[state.kbdIndex]){
      e.preventDefault();
      items[state.kbdIndex].click();
    }
  } else if(e.key === 'Escape'){
    dropdown.classList.remove('show');
    state.kbdIndex = -1;
    searchInput.blur();
  }
});
function updateKbdFocus(items){
  items.forEach((it, i) => it.classList.toggle('kbd-focus', i === state.kbdIndex));
  const active = items[state.kbdIndex];
  if(active) active.scrollIntoView({ block:'nearest', behavior:'smooth' });
}

/* Download */
async function downloadForm(form){
  try{
    const blob = await getFormBlob(form);
    if(!blob){ toast('فایل پیدا نشد', 'err'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = form.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('دانلود شروع شد');
  }catch(e){ toast('خطا در دانلود: ' + (e.message||''), 'err'); }
}

/* Print */
async function printForm(form){
  try{
    const blob = await getFormBlob(form);
    if(!blob){ toast('فایل پیدا نشد', 'err'); return; }
    const type = blob.type || '';
    const isPdf   = type === 'application/pdf' || /\.pdf$/i.test(form.name);
    const isImage = type.startsWith('image/') || /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(form.name);
    const isText  = /\.(txt|md|json|xml|log|ini|yml|yaml)$/i.test(form.name) || (type.startsWith('text/') && !isPdf);

    if(isPdf){
      toast('در حال آماده‌سازی چاپ…', 'info', 2500);
      const url = URL.createObjectURL(blob);
      const iframe = document.createElement('iframe');
      iframe.style.cssText = 'position:fixed;inset-inline-end:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
      iframe.src = url;
      document.body.appendChild(iframe);
      let done = false;
      const go = () => {
        if(done) return; done = true;
        try{
          iframe.contentWindow.focus();
          iframe.contentWindow.print();
          toast('پنجره چاپ باز شد 🖨️');
        }catch(e){ window.open(url, '_blank'); }
        setTimeout(() => { iframe.remove(); URL.revokeObjectURL(url); }, 60000);
      };
      iframe.onload = () => setTimeout(go, 500);
      setTimeout(() => { if(iframe.parentNode) go(); }, 2500);
      return;
    }
    if(isImage){
      toast('در حال آماده‌سازی چاپ…', 'info', 2500);
      const url = URL.createObjectURL(blob);
      const w = window.open('', '_blank');
      if(!w){ URL.revokeObjectURL(url); toast('پنجره جدید مسدود شد', 'err'); return; }
      w.document.write(`<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><title>${esc(form.name)}</title>
        <style>@page{margin:10mm}html,body{margin:0;padding:0}
        body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#fff}
        img{max-width:100%;max-height:100vh;display:block;object-fit:contain}
        .bar{position:fixed;top:12px;inset-inline-end:12px;display:flex;gap:8px}
        .bar button{font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:8px;cursor:pointer;border:none;background:#0e7490;color:#fff}
        .bar .alt{background:#f3f4f6;color:#374151}
        @media print{.bar{display:none!important}}</style>
        </head><body>
        <div class="bar"><button onclick="window.print()">🖨️ چاپ</button><button class="alt" onclick="window.close()">✕</button></div>
        <img src="${url}" onload="setTimeout(function(){window.focus();window.print()},400)">
        </body></html>`);
      w.document.close();
      toast('پنجره چاپ باز شد 🖨️');
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return;
    }
    if(isText){
      const text = await blob.text();
      const w = window.open('', '_blank');
      if(!w) return;
      w.document.write(`<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><title>${esc(form.name)}</title>
        <style>@page{margin:15mm}html,body{margin:0;padding:0;background:#fff}
        body{font-family:'BYekan',Tahoma,Arial,sans-serif;padding:15mm}
        pre{white-space:pre-wrap;word-break:break-word;direction:ltr;text-align:left;font-family:Consolas,monospace;font-size:12px;line-height:1.8;margin:0}
        .bar{position:fixed;top:12px;inset-inline-end:12px;display:flex;gap:8px}
        .bar button{font-size:13px;font-weight:600;padding:9px 16px;border-radius:8px;border:none;background:#0e7490;color:#fff;cursor:pointer}
        .bar .alt{background:#f3f4f6;color:#374151}
        @media print{.bar{display:none!important}body{padding:0}}</style>
        </head><body>
        <div class="bar"><button onclick="window.print()">🖨️ چاپ</button><button class="alt" onclick="window.close()">✕</button></div>
        <pre>${esc(text)}</pre>
        <script>window.onload=function(){setTimeout(function(){window.focus();window.print()},400)};<\/script>
        </body></html>`);
      w.document.close();
      toast('پنجره چاپ باز شد 🖨️');
      return;
    }
    const kind = fileKind(form.name, form.type);
    const ok = await confirmDialog(
      'چاپ فایل ' + kind.label,
      `برای اینکه فایل <b>دقیقاً مثل اصل</b> چاپ بشه، باید فایل اصلی رو دانلود کنی و از خودِ برنامه‌ی <b>${kind.label}</b> چاپ بگیری.<br><br><span style="color:var(--accent-3)">آیا فایل دانلود بشه؟</span>`,
      'بله، دانلود کن',
      true
    );
    if(ok){
      await downloadForm(form);
      toast('فایل دانلود شد — از برنامه‌ی اصلی چاپ بگیر', 'info', 6000);
    }
  }catch(e){ toast('خطا در چاپ: ' + (e.message||''), 'err', 4000); }
}

/* Preview */
async function previewForm(form){
  const body  = $('#previewBody');
  const title = $('#previewTitle');
  const sub   = $('#previewSub');
  const kind  = fileKind(form.name, form.type);

  title.textContent = form.name;
  sub.textContent = `${kind.label} • ${fmtSize(form.size)} • ${fmtDate(form.createdAt)}`;
  body.innerHTML = `<div class="prev-load"><div class="spinner"></div>در حال بارگذاری…</div>`;

  $('#previewModal').classList.add('open');
  document.body.style.overflow = 'hidden';
  $('#previewDlBtn').onclick = () => downloadForm(form);

  const type = form.type || '';
  const isPdf   = type === 'application/pdf' || /\.pdf$/i.test(form.name);
  const isImage = type.startsWith('image/') || /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(form.name);
  const isText  = /\.(txt|md|json|xml|log|ini|yml|yaml)$/i.test(form.name) || (type.startsWith('text/') && !isPdf);

  try{
    if(isPdf){
      const url = await getFormUrl(form);
      body.innerHTML = `<iframe class="prev-frame" src="${url}#toolbar=1&navpanes=0&view=FitH"></iframe>`;
      return;
    }
    if(isImage){
      const url = await getFormUrl(form);
      body.innerHTML = `<img class="prev-img" src="${url}" alt="">`;
      return;
    }
    if(isText){
      const blob = await getFormBlob(form);
      if(!blob) throw new Error('فایل پیدا نشد');
      const text = await blob.text();
      body.innerHTML = `<pre class="prev-text">${esc(text)}</pre>`;
      return;
    }
    body.innerHTML = `
      <div class="prev-unsup" style="--fc:${kind.color}">
        <div class="ic"><svg viewBox="0 0 24 24">${GLYPHS[kind.glyph] || GLYPHS.file}</svg></div>
        <h4>پیش‌نمایش این فایل در مرورگر ممکن نیست</h4>
        <p>مرورگر نمی‌تونه فایل‌های ${kind.label} رو مستقیم نمایش بده. برای مشاهده دانلود کن، یا از دکمه‌ی «چاپ» پرینت بگیر.</p>
        <button class="btn btn-primary" id="prevDlBtn" style="margin:0 auto">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          <span>دانلود فایل</span>
        </button>
      </div>`;
    const btn = document.getElementById('prevDlBtn');
    if(btn) btn.onclick = () => $('#previewDlBtn').click();
  }catch(e){
    body.innerHTML = `<div class="prev-unsup" style="--fc:var(--danger)">
      <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></div>
      <h4>خطا در بارگذاری</h4>
      <p>${esc(e.message||'مشکلی پیش اومد')}</p>
    </div>`;
  }
}

async function deleteForm(form){
  if(!state.isAdmin){ toast('فقط مدیر می‌تونه حذف کنه', 'err'); return; }
  const ok = await confirmDialog(
    'حذف فرم',
    `آیا از حذف <b>«${esc(form.name)}»</b> مطمئنی؟<br>این عمل قابل بازگشت نیست.`,
    'حذف کن',
    false
  );
  if(!ok) return;
  try{
    await deleteFormRecord(form);
    state.forms = state.forms.filter(f => f.id !== form.id);
    render();
    toast('فرم حذف شد');
  }catch(e){ toast('خطا در حذف: ' + (e.message||''), 'err'); }
}

/* Upload */
const uploadModal = $('#uploadModal');
const fileInput = $('#fileInput');
const dropZone = $('#dropZone');
const pendingList = $('#pendingList');
const saveBtn = $('#saveBtn');
const progressArea = $('#progressArea');
let pending = [];

function openUpload(){
  if(!state.isAdmin){ openLogin(); return; }
  pending = [];
  fileInput.value = '';
  progressArea.innerHTML = '';
  renderPending();
  uploadModal.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeUpload(){
  uploadModal.classList.remove('open');
  document.body.style.overflow = '';
  pending = [];
  progressArea.innerHTML = '';
  renderPending();
}
function renderPending(){
  if(!pending.length){
    pendingList.innerHTML = '';
    saveBtn.disabled = true;
    saveBtn.textContent = 'ذخیره فرم‌ها';
    dropZone.style.display = 'block';
    return;
  }
  dropZone.style.display = 'none';
  const validCount = pending.filter(p => p.status !== 'duplicate').length;
  saveBtn.disabled = validCount === 0;
  saveBtn.textContent = validCount > 0 ? `ذخیره ${fa(validCount)} فرم` : 'فایلی برای ذخیره نیست';

  pendingList.innerHTML = pending.map((p,i) => {
    const kind = fileKind(p.name + '.' + (p.file.name.split('.').pop()||''), p.file.type);
    const dis = state.nameMode === 'auto' ? 'disabled' : '';
    let errHtml = '';
    if(p.status === 'duplicate'){
      errHtml = `<div class="p-warn">⚠️ این فایل قبلاً آپلود شده — نمی‌تونه دوباره اضافه بشه</div>`;
    } else if(p.error){
      errHtml = `<div class="p-err">❌ ${esc(p.error)}</div>`;
    }
    const cls = p.status === 'duplicate' ? 'duplicate' : (p.error ? 'failed' : '');
    return `
      <div class="p-item ${cls}" style="--fc:${kind.color}; animation-delay:${i*50}ms" data-idx="${i}">
        <div class="p-ico"><svg viewBox="0 0 24 24">${GLYPHS[kind.glyph] || GLYPHS.file}</svg></div>
        <div class="p-info">
          <input type="text" value="${esc(p.name)}" data-idx="${i}" data-role="name" ${dis} placeholder="اسم فرم…">
          <div class="p-meta">${fmtSize(p.file.size)} • ${kind.label}</div>
          ${errHtml}
        </div>
        <button class="rm-p" data-idx="${i}" data-role="remove" type="button">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>`;
  }).join('');
}

async function addFiles(list){
  if(!state.isAdmin){ openLogin(); return; }
  const files = Array.from(list || []);
  if(!files.length) return;

  // Build a set of existing signatures (name + size)
  const existingSigs = new Set(state.forms.map(f => `${f.name.toLowerCase()}::${f.size}`));

  // Also include files already pending
  const pendingSigs = new Set(pending.map(p => `${p.name.toLowerCase()}::${p.file.size}`));

  for(const f of files){
    const autoName = cleanName(f.name);
    const sig = `${autoName.toLowerCase()}::${f.size}`;

    // check duplicate by name + size
    let isDup = existingSigs.has(sig) || pendingSigs.has(sig);

    // also check by hash if we have hashes
    if(!isDup && state.hashes.length){
      const h = await fileHash(f);
      if(h && state.hashes.includes(h)) isDup = true;
    }

    pending.push({
      file: f,
      name: autoName,
      status: isDup ? 'duplicate' : 'ok',
    });
    pendingSigs.add(sig);
  }
  renderPending();

  const dupCount = pending.filter(p => p.status === 'duplicate').length;
  if(dupCount > 0){
    toast(`${fa(dupCount)} فایل تکراری نادیده گرفته شد`, 'warn', 4000);
  }
}

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => addFiles(e.target.files));
['dragenter','dragover'].forEach(ev =>
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('over'); })
);
['dragleave','drop'].forEach(ev =>
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('over'); })
);
dropZone.addEventListener('drop', e => addFiles(e.dataTransfer.files));
pendingList.addEventListener('input', e => {
  if(e.target.dataset.role === 'name'){
    const i = +e.target.dataset.idx;
    if(pending[i]) pending[i].name = e.target.value;
  }
});
pendingList.addEventListener('click', e => {
  const btn = e.target.closest('[data-role="remove"]');
  if(!btn) return;
  pending.splice(+btn.dataset.idx, 1);
  renderPending();
});
$$('.mode-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.mode-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.nameMode = btn.dataset.mode;
    if(state.nameMode === 'auto') pending.forEach(p => { p.name = cleanName(p.file.name); });
    renderPending();
  });
});

saveBtn.addEventListener('click', async () => {
  if(!state.isAdmin){ openLogin(); return; }
  const valid = pending.filter(p => p.status !== 'duplicate');
  if(!valid.length) return;

  saveBtn.disabled = true;
  saveBtn.textContent = 'در حال آپلود…';
  progressArea.innerHTML = `
    <div class="progress">
      <div class="p-ring">
        <svg viewBox="0 0 56 56">
          <circle class="bg-c" cx="28" cy="28" r="24"/>
          <circle class="fg-c" id="pRingFg" cx="28" cy="28" r="24"
            stroke-dasharray="${2*Math.PI*24}" stroke-dashoffset="${2*Math.PI*24}"/>
        </svg>
        <div class="p-ring-txt" id="pRingTxt">۰٪</div>
      </div>
      <div class="p-body">
        <div class="p-top">در حال آپلود…</div>
        <div class="p-name" id="pName"></div>
      </div>
    </div>`;
  const ring = $('#pRingFg'), ringTxt = $('#pRingTxt'), nameEl = $('#pName');
  const C = 2 * Math.PI * 24;
  const total = valid.length;
  let ok = 0, firstErr = null;

  for(let i = 0; i < total; i++){
    const p = valid[i];
    nameEl.textContent = `(${fa(i+1)}/${fa(total)}) ${p.name}`;
    const pct = i / total;
    ring.style.strokeDashoffset = C * (1 - pct);
    ringTxt.textContent = Math.round(pct*100).toLocaleString('fa-IR') + '٪';

    try{
      const rec = await uploadForm(p.file, p.name.trim() || p.file.name);
      state.forms.unshift(rec);
      ok++;
      const idx = pending.indexOf(p);
      const itemEl = pendingList.querySelector(`.p-item[data-idx="${idx}"]`);
      if(itemEl) itemEl.classList.add('done');
    }catch(err){
      console.error(err);
      const msg = err?.message || String(err);
      if(!firstErr) firstErr = msg;
      p.error = msg;
    }
  }

  ring.style.strokeDashoffset = 0;
  ringTxt.textContent = '۱۰۰٪';

  if(ok === total){
    confetti();
    setTimeout(() => { closeUpload(); render(); toast(`${fa(ok)} فرم ذخیره شد 🎉`); }, 500);
  } else if(ok > 0){
    setTimeout(() => { closeUpload(); render(); toast(`${fa(ok)} ذخیره شد، ${fa(total-ok)} خطا`, 'warn', 4000); }, 1000);
  } else {
    saveBtn.disabled = false;
    saveBtn.textContent = 'تلاش مجدد';
    if(firstErr) toast('خطا: ' + firstErr, 'err', 8000);
  }
});

$('#uploadBtn').addEventListener('click', openUpload);
$('#closeUpload').addEventListener('click', closeUpload);
$('#cancelUpload').addEventListener('click', closeUpload);
uploadModal.addEventListener('click', e => { if(e.target === uploadModal) closeUpload(); });

let dragDepth = 0;
window.addEventListener('dragenter', e => {
  if(!state.isAdmin) return;
  if(e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')){
    dragDepth++;
    if(!uploadModal.classList.contains('open')) openUpload();
    dropZone.classList.add('over');
  }
});
window.addEventListener('dragover', e => { if(state.isAdmin && e.dataTransfer) e.preventDefault(); });
window.addEventListener('dragleave', () => {
  if(!state.isAdmin) return;
  dragDepth = Math.max(0, dragDepth-1);
  if(dragDepth === 0) dropZone.classList.remove('over');
});
window.addEventListener('drop', e => {
  if(!state.isAdmin) return;
  if(e.dataTransfer && e.dataTransfer.files.length){
    e.preventDefault();
    dragDepth = 0;
    if(!uploadModal.classList.contains('open')) openUpload();
    addFiles(e.dataTransfer.files);
  }
});

const previewModal = $('#previewModal');
function closePreview(){
  previewModal.classList.remove('open');
  document.body.style.overflow = '';
  $('#previewBody').innerHTML = '';
}
$('#closePreview').addEventListener('click', closePreview);
$('#previewCloseBtn').addEventListener('click', closePreview);
previewModal.addEventListener('click', e => { if(e.target === previewModal) closePreview(); });

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(confirmModal.classList.contains('open')) resolveConfirm(false);
    else if(loginModal.classList.contains('open')) closeLogin();
    else if(uploadModal.classList.contains('open')) closeUpload();
    else if(previewModal.classList.contains('open')) closePreview();
    else dropdown.classList.remove('show');
  }
});

/* Theme */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.theme);
  $('#themeBtn').innerHTML = state.theme === 'dark'
    ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
  localStorage.setItem('formban-theme', state.theme);
}
$('#themeBtn').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
});

/* Manifest */
function generatePngIcon(size){
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      c.getContext('2d').drawImage(img, 0, 0, size, size);
      try { resolve(c.toDataURL('image/png')); } catch(e){ resolve(LOGO_DATA_URI); }
    };
    img.onerror = () => resolve(LOGO_DATA_URI);
    img.src = LOGO_DATA_URI;
  });
}
async function buildManifest(){
  const baseUrl = new URL('.', location.href).href;
  const [p192, p512] = await Promise.all([generatePngIcon(192), generatePngIcon(512)]);
  const manifest = {
    name: 'جعبه ابزار کفپوش سی تک پارسیان',
    short_name: 'سی تک پارسیان',
    description: 'کتابخانه هوشمند فرم‌های کفپوش سی تک پارسیان',
    start_url: baseUrl, scope: baseUrl,
    display: 'standalone',
    display_override: ['window-controls-overlay','standalone'],
    orientation: 'any',
    background_color: '#07080e',
    theme_color: '#0e7490',
    lang: 'fa', dir: 'rtl',
    icons: [
      { src: p192, sizes:'192x192', type:'image/png', purpose:'any' },
      { src: p512, sizes:'512x512', type:'image/png', purpose:'any' },
      { src: p512, sizes:'512x512', type:'image/png', purpose:'maskable' },
    ],
  };
  const blob = new Blob([JSON.stringify(manifest)], { type:'application/manifest+json' });
  document.getElementById('manifestLink').href = URL.createObjectURL(blob);
}

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope:'./' }).catch(()=>{});
  });
}

let deferredInstall = null;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstall = e;
  installBtn.classList.add('show');
});
installBtn.addEventListener('click', async () => {
  if(!deferredInstall){ toast('از منوی مرورگر → Install', 'info', 4000); return; }
  deferredInstall.prompt();
  const { outcome } = await deferredInstall.userChoice;
  deferredInstall = null;
  installBtn.classList.remove('show');
  if(outcome === 'accepted') toast('سی تک پارسیان نصب شد 🎉');
});
window.addEventListener('appinstalled', () => {
  installBtn.classList.remove('show');
  deferredInstall = null;
});

/* Init */
(async function init(){
  applyTheme();
  console.log('%c🚀 جعبه ابزار کفپوش سی تک پارسیان', 'color:#06b6d4;font-weight:bold;font-size:15px');
  await buildManifest();
  initSupabase();
  try{
    state.forms = await fetchAllForms();
    console.info(`%c📋 ${state.forms.length} فرم بارگذاری شد`, 'color:#f59e0b;font-weight:bold');
  }catch(e){
    state.forms = [];
  }
  render();
})();
</script>
