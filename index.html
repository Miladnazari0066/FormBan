<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سی تک پارسیان">
<meta name="color-scheme" content="dark light">
<title>جعبه ابزار کفپوش سی تک پارسیان</title>
<link id="manifestLink" rel="manifest" href="">
<link id="faviconLink" rel="icon" href="">
<link id="appleIconLink" rel="apple-touch-icon" href="">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@font-face{font-family:'BYekan';src:url('https://cdn.jsdelivr.net/gh/font-store/font-B-Yekan/BYekan.ttf') format('truetype');font-weight:normal;font-style:normal;font-display:swap}

/* ══════════════════════════════════════════════════════════════════
   RESET + BASE
   ══════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
::selection{background:rgba(34,211,238,.35);color:#fff}
:root{
  color-scheme:dark;
  --bg:#080b14;
  --bg-2:#0b1220;
  --surface:rgba(20,25,38,.7);
  --surface-solid:#101829;
  --surface-2:#182033;
  --surface-3:#232c42;
  --border:rgba(255,255,255,.07);
  --border-2:rgba(255,255,255,.12);
  --border-strong:rgba(255,255,255,.22);
  --text:#eef2fa;
  --text-2:#a2adc2;
  --text-3:#6a7490;
  --accent:#0e7490;
  --accent-2:#06b6d4;
  --accent-3:#22d3ee;
  --accent-soft:rgba(34,211,238,.12);
  --accent-glow:rgba(34,211,238,.4);
  --gold:#f59e0b;
  --gold-2:#fcd34d;
  --gold-soft:rgba(245,158,11,.12);
  --success:#10b981;
  --warning:#f59e0b;
  --danger:#ef4444;
  --violet:#8b5cf6;
  --pink:#ec4899;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-2xl:24px;--r-full:999px;
  --shadow-sm:0 2px 8px rgba(0,0,0,.35);
  --shadow-md:0 8px 24px -8px rgba(0,0,0,.55);
  --shadow-lg:0 20px 44px -16px rgba(0,0,0,.75);
  --ease:cubic-bezier(.2,.8,.3,1);
  --ease-spring:cubic-bezier(.34,1.4,.64,1);
  --ease-bounce:cubic-bezier(.68,-.55,.27,1.55);
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f7fc;
  --bg-2:#eef2f9;
  --surface:rgba(255,255,255,.85);
  --surface-solid:#ffffff;
  --surface-2:#f5f8fc;
  --surface-3:#e9eff8;
  --border:rgba(15,23,42,.08);
  --border-2:rgba(15,23,42,.13);
  --border-strong:rgba(15,23,42,.22);
  --text:#0f172a;
  --text-2:#475569;
  --text-3:#8492a6;
  --accent-soft:rgba(6,182,212,.1);
  --shadow-sm:0 2px 8px rgba(15,23,42,.06);
  --shadow-md:0 8px 24px -8px rgba(15,23,42,.12);
  --shadow-lg:0 20px 44px -16px rgba(15,23,42,.16);
}

html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{
  font-family:'BYekan',Tahoma,system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;-webkit-font-smoothing:antialiased;
  transition:background .4s var(--ease), color .4s var(--ease);
  overflow-x:hidden;position:relative;line-height:1.6;
}
b,strong,h1,h2,h3,h4,h5,h6{font-weight:normal}
button,input,textarea,select{font-family:inherit}
img{max-width:100%;display:block}

/* ══════════════════════════════════════════════════════════════════
   PERFORMANCE-FRIENDLY ANIMATED BACKGROUND
   فقط transform + opacity → GPU accelerated
   ══════════════════════════════════════════════════════════════════ */
.bg-layer{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  contain:strict;
}
.bg-orb{
  position:absolute;border-radius:50%;
  will-change:transform;
  transform:translateZ(0);
}
.bg-orb.o1{
  width:600px;height:600px;top:-260px;right:-200px;
  background:radial-gradient(circle,rgba(6,182,212,.35) 0%,transparent 65%);
  filter:blur(80px);
  animation:float1 32s linear infinite;
}
.bg-orb.o2{
  width:520px;height:520px;bottom:-220px;left:-180px;
  background:radial-gradient(circle,rgba(245,158,11,.28) 0%,transparent 65%);
  filter:blur(80px);
  animation:float2 38s linear infinite;
}
.bg-orb.o3{
  width:420px;height:420px;top:40%;left:45%;
  background:radial-gradient(circle,rgba(139,92,246,.28) 0%,transparent 65%);
  filter:blur(80px);
  animation:float3 46s linear infinite;
}
[data-theme="light"] .bg-orb{opacity:.7}

@keyframes float1{
  0%{transform:translate3d(0,0,0) scale(1)}
  25%{transform:translate3d(-60px,80px,0) scale(1.08)}
  50%{transform:translate3d(-30px,40px,0) scale(1.02)}
  75%{transform:translate3d(40px,-20px,0) scale(.96)}
  100%{transform:translate3d(0,0,0) scale(1)}
}
@keyframes float2{
  0%{transform:translate3d(0,0,0) scale(1)}
  25%{transform:translate3d(70px,-50px,0) scale(1.1)}
  50%{transform:translate3d(40px,-20px,0) scale(.95)}
  75%{transform:translate3d(-30px,60px,0) scale(1.05)}
  100%{transform:translate3d(0,0,0) scale(1)}
}
@keyframes float3{
  0%{transform:translate3d(-50%,-50%,0) scale(1)}
  50%{transform:translate3d(-55%,-45%,0) scale(1.15)}
  100%{transform:translate3d(-50%,-50%,0) scale(1)}
}

/* Grid pattern - static, just fades in and out */
.bg-grid{
  position:absolute;inset:0;opacity:0;
  background-image:
    linear-gradient(rgba(255,255,255,.4) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.4) 1px, transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 40%, #000 20%, transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%, #000 20%, transparent 75%);
  animation:gridFade 30s ease-in-out infinite alternate;
}
[data-theme="light"] .bg-grid{
  background-image:
    linear-gradient(rgba(15,23,42,.2) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15,23,42,.2) 1px, transparent 1px);
}
@keyframes gridFade{0%{opacity:.02}100%{opacity:.045}}

/* Twinkling stars/dots */
.bg-dots{position:absolute;inset:0;opacity:.5}
.bg-dot{
  position:absolute;width:3px;height:3px;border-radius:50%;
  background:var(--accent-3);
  box-shadow:0 0 10px var(--accent-3);
  will-change:opacity,transform;
  animation:twinkle 4s ease-in-out infinite;
  transform:translateZ(0);
}
.bg-dot:nth-child(3n){background:var(--gold-2);box-shadow:0 0 10px var(--gold-2);animation-delay:-1s}
.bg-dot:nth-child(3n+1){background:var(--violet);box-shadow:0 0 10px var(--violet);animation-delay:-2s}
@keyframes twinkle{
  0%,100%{opacity:0;transform:scale(.5)}
  50%{opacity:.9;transform:scale(1.4)}
}

/* ══════════════════════════════════════════════════════════════════
   TOPBAR
   ══════════════════════════════════════════════════════════════════ */
.topbar{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px 28px;
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter:blur(18px) saturate(180%);
  -webkit-backdrop-filter:blur(18px) saturate(180%);
  border-bottom:1px solid var(--border);
  animation:slideDown .6s var(--ease) both;
  transform:translateZ(0);
}
@keyframes slideDown{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}

.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand-logo{
  width:46px;height:46px;flex-shrink:0;position:relative;
  display:grid;place-items:center;
  transition:transform .4s var(--ease-spring);
}
.brand-logo svg{
  width:46px;height:46px;display:block;border-radius:12px;
  position:relative;z-index:2;
  filter:drop-shadow(0 6px 16px rgba(6,182,212,.45));
}
.brand-logo::before{
  content:'';position:absolute;inset:-6px;border-radius:18px;
  background:conic-gradient(from 0deg, var(--accent-3), var(--gold-2), var(--violet), var(--pink), var(--accent-3));
  opacity:.7;filter:blur(12px);z-index:1;
  animation:spin 6s linear infinite;
  transform:translateZ(0);
}
.brand:hover .brand-logo{transform:rotate(-8deg) scale(1.1)}
@keyframes spin{to{transform:rotate(360deg)}}

.brand-text h1{
  font-size:1.02rem;font-weight:bold;letter-spacing:-.3px;line-height:1.25;
  background:linear-gradient(120deg,var(--text) 0%,var(--accent-3) 35%,var(--gold-2) 70%,var(--text) 100%);
  background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:shimmer 7s ease-in-out infinite;
}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.brand-text p{font-size:.66rem;color:var(--text-3);margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:8px}

.status-pill{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.68rem;font-weight:bold;
  padding:6px 11px;border-radius:var(--r-full);
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-2);
  transition:all .3s var(--ease);
}
.status-pill .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--text-3);position:relative;
  transition:background .3s;
}
.status-pill.online .dot{background:var(--success);box-shadow:0 0 10px var(--success);animation:pulse 2s ease-in-out infinite}
.status-pill.local .dot{background:var(--warning);box-shadow:0 0 10px var(--warning)}
.status-pill.offline .dot{background:var(--accent-3);box-shadow:0 0 10px var(--accent-3);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.3);opacity:.7}
}

/* ══════════════════════════════════════════════════════════════════
   BUTTONS — با ripple و shine
   ══════════════════════════════════════════════════════════════════ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-size:.82rem;font-weight:bold;border:none;cursor:pointer;
  transition:transform .2s var(--ease),box-shadow .3s var(--ease);
  white-space:nowrap;text-decoration:none;
  position:relative;overflow:hidden;isolation:isolate;
  transform:translateZ(0);
}
.btn svg{width:15px;height:15px;flex-shrink:0;transition:transform .3s var(--ease-spring)}
.btn:active{transform:scale(.96)}
.btn:hover svg{transform:scale(1.12) rotate(4deg)}

.btn-primary{
  color:#fff;padding:10px 18px;border-radius:var(--r-md);
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 60%,var(--accent-3) 100%);
  background-size:200% 200%;
  box-shadow:0 6px 20px -6px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.25);
  animation:gradientShift 5s ease-in-out infinite;
}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.btn-primary::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  transition:left .6s var(--ease);
}
.btn-primary:hover::before{left:100%}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 28px -8px var(--accent-glow)}

.btn-ghost{
  background:transparent;color:var(--text-2);
  padding:9px 14px;border-radius:var(--r-md);border:1px solid var(--border-2);
}
.btn-ghost:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-strong);transform:translateY(-1px)}

.btn-gold{
  color:#fff;padding:10px 18px;border-radius:var(--r-md);
  background:linear-gradient(135deg,var(--gold),var(--gold-2));
  box-shadow:0 6px 18px -6px rgba(245,158,11,.45);
  font-size:.82rem;font-weight:bold;border:none;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  transition:all .2s var(--ease);position:relative;overflow:hidden;
}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 12px 28px -8px rgba(245,158,11,.55)}
.btn-gold svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.icon-btn{
  width:38px;height:38px;flex-shrink:0;
  display:grid;place-items:center;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-2);cursor:pointer;
  transition:all .25s var(--ease);position:relative;
  overflow:hidden;transform:translateZ(0);
}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease-spring);position:relative;z-index:1}
.icon-btn::before{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(circle at var(--rx,50%) var(--ry,50%), var(--accent-soft), transparent 70%);
  opacity:0;transition:opacity .3s;
}
.icon-btn:hover{color:var(--accent-3);border-color:rgba(34,211,238,.4);transform:translateY(-2px) scale(1.05)}
.icon-btn:hover::before{opacity:1}
.icon-btn:hover svg{transform:rotate(12deg) scale(1.15)}
.icon-btn.lock-on{color:var(--gold-2);border-color:rgba(245,158,11,.5);background:var(--gold-soft)}
.icon-btn.lock-on::after{
  content:'';position:absolute;top:-3px;inset-inline-end:-3px;
  width:11px;height:11px;border-radius:50%;
  background:var(--gold);border:2px solid var(--bg);
  box-shadow:0 0 10px var(--gold);
  animation:pulse 2s ease-in-out infinite;
}
.icon-btn.mode-offline{
  color:var(--accent-3);border-color:rgba(34,211,238,.5);background:var(--accent-soft);
  box-shadow:0 0 14px -4px var(--accent-glow);
}
.icon-btn.mode-offline::after{
  content:'';position:absolute;top:-3px;inset-inline-end:-3px;
  width:11px;height:11px;border-radius:50%;
  background:var(--accent-3);border:2px solid var(--bg);
  box-shadow:0 0 10px var(--accent-3);
  animation:pulse 2s ease-in-out infinite;
}

.install-btn{
  display:none;align-items:center;gap:6px;
  font-size:.8rem;font-weight:bold;color:var(--accent-3);
  background:var(--accent-soft);border:1px solid rgba(34,211,238,.35);
  padding:9px 14px;border-radius:var(--r-md);cursor:pointer;
  transition:all .25s var(--ease);position:relative;overflow:hidden;
}
.install-btn:hover{background:rgba(34,211,238,.22);transform:translateY(-1px);box-shadow:0 8px 20px -8px var(--accent-glow)}
.install-btn.show{display:inline-flex;animation:bounceIn .6s var(--ease-bounce) both}
.install-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@keyframes bounceIn{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}

/* ══════════════════════════════════════════════════════════════════
   MAIN + HERO
   ══════════════════════════════════════════════════════════════════ */
main{
  position:relative;z-index:10;
  max-width:860px;margin:0 auto;
  padding:64px 24px 120px;
  min-height:calc(100vh - 65px);
}

.hero{text-align:center;margin-bottom:40px}
.hero h2{
  font-size:clamp(1.4rem,3.8vw,2rem);
  font-weight:bold;letter-spacing:-.7px;line-height:1.4;
  margin-bottom:32px;min-height:1.5em;
  background:linear-gradient(120deg,var(--text) 0%,var(--accent-3) 40%,var(--gold-2) 65%,var(--accent-3) 85%,var(--text) 100%);
  background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:shimmer 8s ease-in-out infinite, heroIn .8s var(--ease) both;
  filter:drop-shadow(0 4px 24px rgba(6,182,212,.15));
}
@keyframes heroIn{
  from{opacity:0;transform:translateY(30px) scale(.95);filter:blur(8px)}
  to{opacity:1;transform:none;filter:blur(0)}
}
.type-cursor{
  display:inline-block;width:3px;height:.9em;
  background:linear-gradient(180deg,var(--accent-3),var(--gold-2));
  margin-inline-start:5px;vertical-align:middle;border-radius:2px;
  box-shadow:0 0 12px var(--accent-glow);
  animation:blink 1s step-end infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ══════════════════════════════════════════════════════════════════
   SEARCH BOX
   ══════════════════════════════════════════════════════════════════ */
.search-wrap{position:relative;max-width:700px;margin:0 auto;animation:searchIn .8s var(--ease-spring) .15s both}
@keyframes searchIn{
  from{opacity:0;transform:translateY(30px) scale(.94);filter:blur(6px)}
  to{opacity:1;transform:none;filter:blur(0)}
}
.search-box{
  display:flex;align-items:center;gap:12px;
  padding:7px 22px;border-radius:var(--r-xl);
  background:var(--surface);
  border:1.5px solid var(--border-2);
  transition:border-color .3s var(--ease),box-shadow .3s var(--ease),transform .3s var(--ease);
  box-shadow:var(--shadow-md);
  position:relative;overflow:hidden;
  transform:translateZ(0);
}
.search-box::before{
  content:'';position:absolute;inset:0;
  border-radius:inherit;
  background:linear-gradient(120deg,transparent 30%,rgba(34,211,238,.08) 50%,transparent 70%);
  background-size:200% 100%;
  opacity:0;transition:opacity .4s;
  pointer-events:none;
}
.search-box:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.search-box:hover::before{opacity:1;animation:shine 2s ease-in-out infinite}
@keyframes shine{0%{background-position:200% 0}100%{background-position:-200% 0}}
.search-box.focused{
  border-color:var(--accent-3);
  box-shadow:0 0 0 4px var(--accent-soft), var(--shadow-lg);
  transform:translateY(-3px) scale(1.005);
}
.search-box .ico{
  width:20px;height:20px;flex-shrink:0;
  stroke:var(--text-3);fill:none;stroke-width:2.2;
  stroke-linecap:round;transition:stroke .3s,transform .3s;
}
.search-box.focused .ico{stroke:var(--accent-3);transform:scale(1.15)}
.search-box input{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--text);font-size:1.02rem;padding:17px 0;min-width:0;
}
.search-box input::placeholder{color:var(--text-3)}
.kbd-hint{display:inline-flex;gap:3px;flex-shrink:0}
.kbd-hint kbd{
  font-size:.64rem;font-weight:bold;padding:3px 6px;
  border-radius:6px;background:var(--surface-3);
  color:var(--text-3);border:1px solid var(--border);
}
.search-box.focused .kbd-hint{display:none}
.clear-search{
  width:28px;height:28px;flex-shrink:0;
  display:none;place-items:center;
  border-radius:var(--r-sm);border:none;
  background:var(--surface-3);color:var(--text-3);
  cursor:pointer;font-size:1rem;line-height:1;
  transition:all .25s var(--ease-spring);
}
.clear-search:hover{background:var(--danger);color:#fff;transform:rotate(90deg) scale(1.1)}
.clear-search.show{display:grid;animation:popIn .3s var(--ease-spring)}
@keyframes popIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}

/* ══════════════════════════════════════════════════════════════════
   DROPDOWN
   ══════════════════════════════════════════════════════════════════ */
.dropdown{
  position:absolute;top:calc(100% + 10px);left:0;right:0;
  display:none;flex-direction:column;
  background:var(--surface-solid);
  border:1px solid var(--border-2);
  border-radius:var(--r-xl);
  box-shadow:var(--shadow-lg);
  overflow:hidden;z-index:70;
  max-height:min(70vh,620px);
  transform:translateZ(0);
}
.dropdown.show{display:flex;animation:ddIn .3s var(--ease-spring) both}
@keyframes ddIn{
  from{opacity:0;transform:translateY(-10px) scale(.97)}
  to{opacity:1;transform:none}
}
.dd-filter{
  display:flex;align-items:center;gap:6px;
  padding:11px 14px;border-bottom:1px solid var(--border);
  overflow-x:auto;flex-shrink:0;scrollbar-width:none;
}
.dd-filter::-webkit-scrollbar{display:none}
.fchip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.72rem;font-weight:bold;
  padding:6px 11px;border-radius:var(--r-full);
  background:transparent;color:var(--text-3);
  border:1px solid var(--border-2);
  cursor:pointer;white-space:nowrap;
  transition:all .25s var(--ease);
  position:relative;overflow:hidden;
}
.fchip:hover{color:var(--text);border-color:var(--border-strong);background:var(--surface-2);transform:translateY(-1px)}
.fchip.active{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;border-color:transparent;
  box-shadow:0 4px 14px -4px var(--accent-glow);
}
.fchip.active::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%);
  animation:fchipPulse 1.5s ease-out;
}
@keyframes fchipPulse{from{opacity:1;transform:scale(0)}to{opacity:0;transform:scale(1.5)}}
.fchip .n{font-size:.62rem;padding:1px 6px;border-radius:var(--r-full);background:rgba(255,255,255,.14)}
.fchip.active .n{background:rgba(255,255,255,.28)}
.dd-body{overflow-y:auto;flex:1;padding:6px}

.res{
  position:relative;display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:var(--r-md);

  transform:translateZ(0);
}
@keyframes resIn{
  from{opacity:0;transform:translateX(-14px)}
  to{opacity:1;transform:none}
}
.res::before{
  content:'';position:absolute;inset-inline-start:0;top:15%;bottom:15%;
  width:3px;border-radius:3px;

}
.res:hover::before,.res.kbd-focus::before{transform:scaleY(1)}
.res:hover,.res.kbd-focus{background:var(--surface-2)}

.res-ico{
  width:42px;height:42px;flex-shrink:0;
  display:grid;place-items:center;border-radius:var(--r-md);
  background:color-mix(in srgb,var(--fc) 15%,transparent);
  border:1px solid color-mix(in srgb,var(--fc) 26%,transparent);
  transition:transform .3s var(--ease-spring);
}
.res:hover .res-ico{transform:scale(1.1) rotate(-6deg)}
.res-ico svg{width:20px;height:20px;stroke:var(--fc);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.res-body{flex:1;min-width:0}
.res-name{font-size:.88rem;font-weight:bold;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-name mark{background:linear-gradient(180deg,transparent 55%,var(--gold-soft) 55%);color:var(--gold-2);font-weight:bold;padding:0 2px;border-radius:3px}
.res-meta{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:.68rem;color:var(--text-3)}
.res-meta .sep{opacity:.4}
.res-meta .badge-cached{color:var(--success);font-weight:bold}
.res-meta .badge-cloud{color:var(--accent-3);font-weight:bold}
.res-acts{display:flex;gap:2px;flex-shrink:0;opacity:0;transition:opacity .25s;transform:translateX(6px)}
.res:hover .res-acts,.res.kbd-focus .res-acts{opacity:1;transform:translateX(0)}
.res-act{
  width:30px;height:30px;display:grid;place-items:center;
  border-radius:var(--r-sm);border:none;background:transparent;
  color:var(--text-3);cursor:pointer;
  transition:all .25s var(--ease-spring);
}
.res-act:hover{background:var(--surface-3);color:var(--text);transform:scale(1.18) translateY(-2px)}
.res-act svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.res-act.pv:hover{color:var(--accent-3);background:var(--accent-soft)}
.res-act.dl:hover{color:var(--success);background:rgba(16,185,129,.12)}
.res-act.pr:hover{color:var(--gold);background:var(--gold-soft)}
.res-act.rm:hover{color:var(--danger);background:rgba(239,68,68,.12)}

.dd-empty{padding:48px 24px;text-align:center;color:var(--text-3);animation:resIn .4s both}
.dd-empty .ic{
  width:60px;height:60px;margin:0 auto 14px;
  border-radius:var(--r-lg);
  background:var(--surface-2);border:1px solid var(--border);
  display:grid;place-items:center;
  animation:emptyFloat 3s var(--ease) infinite;
}
@keyframes emptyFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(4deg)}}
.dd-empty .ic svg{width:28px;height:28px;stroke:var(--text-3);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dd-empty p{font-size:.85rem}

.dd-section-title{padding:8px 14px 6px;font-size:.66rem;font-weight:bold;color:var(--text-3);letter-spacing:.4px}
.recent-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:var(--r-md);
  cursor:pointer;font-size:.85rem;color:var(--text-2);
  transition:all .2s var(--ease);
}
.recent-item:hover{background:var(--surface-2);color:var(--text);transform:translateX(-3px)}
.recent-item svg{width:15px;height:15px;stroke:var(--text-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.recent-item .x{
  margin-inline-start:auto;width:22px;height:22px;
  display:grid;place-items:center;border-radius:var(--r-sm);
  background:transparent;border:none;color:var(--text-3);
  cursor:pointer;font-size:.9rem;transition:all .2s;
}
.recent-item .x:hover{background:var(--danger);color:#fff;transform:rotate(90deg)}

/* ══════════════════════════════════════════════════════════════════
   ADMIN PANEL
   ══════════════════════════════════════════════════════════════════ */
.admin-panel{display:none;margin-top:40px;animation:adminIn .6s var(--ease-spring) both}
.admin-panel.show{display:block}
@keyframes adminIn{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}

.admin-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:18px;padding:16px 20px;
  border-radius:var(--r-lg);
  background:linear-gradient(135deg,var(--gold-soft),transparent 60%);
  border:1px solid rgba(245,158,11,.35);
  flex-wrap:wrap;
  position:relative;overflow:hidden;
}
.admin-head::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(252,211,77,.12),transparent);
  animation:adminShine 3s ease-in-out infinite;
}
@keyframes adminShine{0%{left:-100%}100%{left:100%}}
.admin-head h3{font-size:.95rem;font-weight:bold;display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.admin-head h3 svg{width:18px;height:18px;stroke:var(--gold-2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.admin-head .count{
  font-size:.72rem;padding:4px 10px;border-radius:var(--r-full);
  background:var(--gold-soft);color:var(--gold-2);
  border:1px solid rgba(245,158,11,.35);font-weight:bold;
  position:relative;z-index:1;
}
.admin-head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:relative;z-index:1}
.sync-status{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.68rem;font-weight:bold;
  padding:5px 10px;border-radius:var(--r-full);
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--text-2);transition:all .3s;
}
.sync-status.done{color:var(--success);border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.08)}
.sync-status.syncing{color:var(--accent-3);border-color:rgba(34,211,238,.35);background:var(--accent-soft)}
.sync-status.syncing::before{
  content:'';width:8px;height:8px;border-radius:50%;
  border:2px solid var(--accent-3);border-top-color:transparent;
  animation:spin .8s linear infinite;
}

.admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.admin-card{
  display:flex;align-items:center;gap:12px;
  padding:13px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--border);
  transition:all .3s var(--ease);
  animation:cardIn .5s var(--ease-spring) both;
  position:relative;overflow:hidden;
  transform:translateZ(0);
}
@keyframes cardIn{from{opacity:0;transform:translateY(15px) scale(.94)}to{opacity:1;transform:none}}
.admin-card::before{
  content:'';position:absolute;inset:0;
  border-radius:inherit;
  background:linear-gradient(135deg,transparent,var(--accent-soft),transparent);
  opacity:0;transition:opacity .3s;
  pointer-events:none;
}
.admin-card:hover{
  border-color:var(--accent-3);
  transform:translateY(-3px);
  box-shadow:0 12px 30px -10px var(--accent-glow);
}
.admin-card:hover::before{opacity:1}
.admin-card.cached{border-color:rgba(16,185,129,.3)}
.admin-card .card-badge{
  position:absolute;top:-6px;inset-inline-end:10px;
  font-size:.6rem;font-weight:bold;
  padding:3px 9px;border-radius:var(--r-full);
  background:var(--surface-2);color:var(--text-3);
  border:1px solid var(--border);
  z-index:1;
}
.admin-card.cached .card-badge{background:rgba(16,185,129,.15);color:var(--success);border-color:rgba(16,185,129,.4)}
.admin-card .card-ico{
  width:46px;height:46px;flex-shrink:0;
  display:grid;place-items:center;border-radius:var(--r-md);
  background:color-mix(in srgb,var(--fc) 15%,transparent);
  border:1px solid color-mix(in srgb,var(--fc) 26%,transparent);
  transition:transform .3s var(--ease-spring);
}
.admin-card:hover .card-ico{transform:scale(1.1) rotate(-8deg)}
.admin-card .card-ico svg{width:21px;height:21px;stroke:var(--fc);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.admin-card .card-body{flex:1;min-width:0}
.admin-card .card-name{
  font-size:.86rem;font-weight:bold;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  margin-bottom:3px;
}
.admin-card .card-meta{display:flex;align-items:center;gap:6px;font-size:.66rem;color:var(--text-3)}
.admin-card .card-meta .sep{opacity:.4}
.admin-card .card-acts{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.admin-card .mini-btn{
  width:28px;height:28px;display:grid;place-items:center;
  border-radius:var(--r-sm);border:none;background:transparent;
  color:var(--text-3);cursor:pointer;
  transition:all .25s var(--ease-spring);
}
.admin-card .mini-btn:hover{background:var(--surface-3);color:var(--text);transform:scale(1.18)}
.admin-card .mini-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.admin-card .mini-btn.pv:hover{color:var(--accent-3);background:var(--accent-soft)}
.admin-card .mini-btn.dl:hover{color:var(--success);background:rgba(16,185,129,.12)}
.admin-card .mini-btn.rm:hover{color:var(--danger);background:rgba(239,68,68,.12)}

.admin-empty{
  padding:60px 24px;text-align:center;color:var(--text-3);
  border:2px dashed var(--border-2);border-radius:var(--r-lg);
}
.admin-empty svg{
  width:52px;height:52px;margin-bottom:14px;
  stroke:var(--text-3);fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;
  animation:emptyFloat 3.5s var(--ease) infinite;
}
.admin-empty h4{font-size:.95rem;font-weight:bold;margin-bottom:6px;color:var(--text)}
.admin-empty p{font-size:.82rem}

/* ══════════════════════════════════════════════════════════════════
   MODALS
   ══════════════════════════════════════════════════════════════════ */
.overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(4,6,12,.8);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  display:none;place-items:center;padding:20px;overflow-y:auto;
}
.overlay.open{display:grid;animation:fade .25s ease}
.overlay.high{z-index:200}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:580px;
  background:var(--surface-solid);
  border:1px solid var(--border-2);
  border-radius:var(--r-2xl);
  box-shadow:0 30px 80px -20px rgba(0,0,0,.9);
  overflow:hidden;margin:auto;
  animation:modalIn .5s var(--ease-spring) both;
  position:relative;
}
.modal::before{
  content:'';position:absolute;inset:0;
  border-radius:inherit;padding:1px;
  background:linear-gradient(135deg,rgba(34,211,238,.4),rgba(245,158,11,.3),rgba(139,92,246,.4),rgba(34,211,238,.4));
  background-size:300% 300%;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:.5;
  animation:gradientShift 6s ease-in-out infinite;
  pointer-events:none;z-index:10;
}
.modal.wide{max-width:1100px}
.modal.small{max-width:440px}
@keyframes modalIn{
  from{opacity:0;transform:scale(.88) translateY(30px);filter:blur(8px)}
  to{opacity:1;transform:none;filter:blur(0)}
}
.m-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:22px 24px;border-bottom:1px solid var(--border);
  position:relative;z-index:1;
  background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);
}
.m-head h3{font-size:1.05rem;font-weight:bold;letter-spacing:-.2px}
.m-head p{font-size:.75rem;color:var(--text-3);margin-top:4px}
.m-close{
  width:36px;height:36px;flex-shrink:0;
  display:grid;place-items:center;border-radius:var(--r-sm);
  border:1px solid var(--border);background:transparent;
  color:var(--text-3);cursor:pointer;font-size:1.15rem;line-height:1;
  transition:all .25s var(--ease-spring);
}
.m-close:hover{color:#fff;background:var(--danger);border-color:transparent;transform:rotate(90deg) scale(1.08)}
.m-body{padding:22px 24px;max-height:70vh;overflow-y:auto;position:relative;z-index:1}
.m-foot{
  display:flex;gap:10px;padding:16px 24px;
  border-top:1px solid var(--border);
  background:var(--surface-2);
  position:relative;z-index:1;
}
.m-foot .btn{flex:1;padding:12px;font-size:.86rem;border-radius:var(--r-md)}
.m-foot .btn-primary{flex:2}

.mode-toggle{
  display:flex;gap:4px;margin-bottom:16px;padding:4px;
  border-radius:var(--r-md);background:var(--surface-2);
  border:1px solid var(--border);position:relative;
}
.mode-toggle button{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:10px;border-radius:var(--r-sm);border:none;
  background:transparent;color:var(--text-3);
  cursor:pointer;font-size:.78rem;font-weight:bold;
  transition:all .3s var(--ease);position:relative;z-index:1;
}
.mode-toggle button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mode-toggle button.active{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;box-shadow:0 4px 14px -4px var(--accent-glow);
}

.drop-zone{
  border:2px dashed var(--border-strong);
  border-radius:var(--r-lg);
  padding:44px 22px;text-align:center;cursor:pointer;
  background:var(--surface-2);
  transition:all .3s var(--ease);
  position:relative;overflow:hidden;
}
.drop-zone::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 50%,var(--accent-soft),transparent 70%);
  opacity:0;transition:opacity .4s;
}
.drop-zone:hover,.drop-zone.over{
  border-color:var(--accent-3);
  border-style:solid;
  background:color-mix(in srgb,var(--accent-3) 5%,var(--surface-2));
  transform:translateY(-3px);
  box-shadow:0 20px 44px -18px var(--accent-glow);
}
.drop-zone:hover::before,.drop-zone.over::before{opacity:1}
.drop-zone.over{transform:scale(1.02)}
.drop-zone svg{
  width:44px;height:44px;margin-bottom:14px;
  stroke:var(--accent-3);fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;
  transition:transform .4s var(--ease-spring);
  position:relative;z-index:1;
}
.drop-zone:hover svg{transform:translateY(-8px) scale(1.15);animation:dropBounce 1.2s var(--ease) infinite}
@keyframes dropBounce{0%,100%{transform:translateY(-8px) scale(1.15)}50%{transform:translateY(-14px) scale(1.2)}}
.drop-zone h4{font-size:.94rem;font-weight:bold;margin-bottom:6px;position:relative;z-index:1}
.drop-zone p{font-size:.78rem;color:var(--text-3);line-height:1.85;position:relative;z-index:1}
.formats{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:14px;position:relative;z-index:1}
.formats span{
  font-size:.6rem;font-weight:bold;letter-spacing:.4px;
  padding:4px 9px;border-radius:var(--r-sm);
  background:var(--surface-3);color:var(--text-3);
  border:1px solid var(--border);
  transition:all .25s var(--ease-spring);
}
.formats span:hover{background:var(--accent-soft);color:var(--accent-3);border-color:var(--accent-3);transform:translateY(-2px) scale(1.05)}

.pending{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.p-item{
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:11px;
  padding:12px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--border);
  animation:pIn .5s var(--ease-spring) both;
  transition:all .3s var(--ease);
}
@keyframes pIn{from{opacity:0;transform:translateX(-20px) scale(.92)}to{opacity:1;transform:none}}
.p-item:hover{transform:translateX(-3px)}
.p-item.done{border-color:rgba(16,185,129,.4)}
.p-item.done::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(16,185,129,.2));
  animation:flash .9s forwards;
}
.p-item.failed{background:color-mix(in srgb,var(--danger) 6%,var(--surface-2));border-color:rgba(239,68,68,.35)}
.p-item.duplicate{background:color-mix(in srgb,var(--warning) 6%,var(--surface-2));border-color:rgba(245,158,11,.4)}
@keyframes flash{to{opacity:0}}
.p-ico{
  width:42px;height:42px;flex-shrink:0;
  display:grid;place-items:center;border-radius:var(--r-md);
  background:color-mix(in srgb,var(--fc) 16%,transparent);
  border:1px solid color-mix(in srgb,var(--fc) 28%,transparent);
  transition:transform .3s var(--ease-spring);
}
.p-item:hover .p-ico{transform:scale(1.1) rotate(6deg)}
.p-ico svg{width:20px;height:20px;stroke:var(--fc);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.p-info{flex:1;min-width:0}
.p-info input{
  width:100%;background:var(--surface-3);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:9px 11px;color:var(--text);
  font-size:.85rem;outline:none;transition:all .25s;
}
.p-info input:focus{border-color:var(--accent-3);box-shadow:0 0 0 3px var(--accent-soft)}
.p-info input:disabled{opacity:.55;cursor:not-allowed}
.p-meta{font-size:.66rem;color:var(--text-3);margin-top:5px}
.p-err{font-size:.68rem;color:var(--danger);margin-top:5px;font-weight:bold}
.p-warn{font-size:.68rem;color:var(--warning);margin-top:5px;font-weight:bold}
.rm-p{
  width:30px;height:30px;flex-shrink:0;
  display:grid;place-items:center;border-radius:var(--r-sm);
  border:none;background:transparent;color:var(--text-3);
  cursor:pointer;transition:all .25s var(--ease-spring);
}
.rm-p:hover{background:var(--danger);color:#fff;transform:rotate(90deg) scale(1.1)}
.rm-p svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

.progress{
  margin-top:16px;padding:18px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--border);
  display:flex;align-items:center;gap:16px;
  animation:pIn .4s var(--ease-spring) both;
}
.p-ring{width:64px;height:64px;flex-shrink:0;position:relative}
.p-ring svg{transform:rotate(-90deg);width:64px;height:64px}
.p-ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.p-ring .bg-c{stroke:var(--surface-3)}
.p-ring .fg-c{stroke:url(#ringGrad);transition:stroke-dashoffset .4s var(--ease);filter:drop-shadow(0 0 8px var(--accent-glow))}
.p-ring-txt{position:absolute;inset:0;display:grid;place-items:center;font-size:.76rem;font-weight:bold;color:var(--accent-3)}
.p-body{flex:1;min-width:0}
.p-top{font-size:.82rem;color:var(--text-2);margin-bottom:4px;font-weight:bold}
.p-name{font-size:.7rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.login-head{display:flex;align-items:center;gap:14px}
.login-ico{
  width:56px;height:56px;flex-shrink:0;
  display:grid;place-items:center;border-radius:var(--r-md);
  background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(245,158,11,.12));
  border:1px solid rgba(34,211,238,.35);
  animation:emptyFloat 3s var(--ease) infinite;
  box-shadow:0 8px 24px -8px var(--accent-glow);
}
.login-ico svg{width:26px;height:26px;stroke:var(--accent-3);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.pw-field{position:relative;margin-bottom:12px}
.pw-field input{
  width:100%;background:var(--surface-2);
  border:1.5px solid var(--border-2);border-radius:var(--r-md);
  padding:16px 52px 16px 16px;color:var(--text);
  font-size:1.15rem;font-weight:bold;outline:none;
  transition:all .25s;letter-spacing:4px;text-align:center;
}
.pw-field input:focus{border-color:var(--accent-3);box-shadow:0 0 0 4px var(--accent-soft);transform:scale(1.01)}

  15%{transform:translateX(-14px) rotate(-2deg)}
  30%{transform:translateX(14px) rotate(2deg)}
  45%{transform:translateX(-10px) rotate(-1deg)}
  60%{transform:translateX(10px) rotate(1deg)}
  75%{transform:translateX(-5px)}
}
.pw-eye{
  position:absolute;top:50%;inset-inline-end:8px;transform:translateY(-50%);
  width:38px;height:38px;display:grid;place-items:center;
  border-radius:var(--r-sm);border:none;background:transparent;
  color:var(--text-3);cursor:pointer;transition:all .25s;
}
.pw-eye:hover{background:var(--surface-3);color:var(--accent-3)}
.pw-eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  font-size:.82rem;font-weight:bold;
  background:rgba(239,68,68,.12);

}

.pw-hint{font-size:.72rem;color:var(--text-3);text-align:center;margin-top:14px}

.prev-frame{width:100%;height:75vh;border:none;border-radius:var(--r-md);background:#2a2d33;display:block}

}

  animation:emptyFloat 3s var(--ease) infinite;
}
.prev-unsup .ic svg{width:38px;height:38px;stroke:var(--fc);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.prev-unsup h4{font-size:1rem;font-weight:bold;margin-bottom:8px}

.confirm-ico svg{width:34px;height:34px;stroke:var(--danger);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.confirm-body h4{font-size:1.05rem;font-weight:bold;margin-bottom:8px}

/* ══════════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════════ */
.toast-wrap{position:fixed;bottom:24px;inset-inline-end:24px;z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:10px;
  padding:13px 18px;border-radius:var(--r-md);
  font-size:.83rem;font-weight:bold;
  background:var(--surface-solid);
  border:1px solid var(--border-2);
  box-shadow:var(--shadow-lg);
  animation:toastIn .5s var(--ease-spring) both;
  min-width:220px;max-width:380px;pointer-events:auto;
  position:relative;overflow:hidden;
}
.toast::before{
  content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;
  width:3px;background:currentColor;
  box-shadow:0 0 12px currentColor;
}
.toast.out{animation:toastOut .3s var(--ease) forwards}
@keyframes toastIn{
  from{opacity:0;transform:translateX(80px) scale(.8) rotate(6deg)}
  to{opacity:1;transform:none}
}
@keyframes toastOut{to{opacity:0;transform:translateX(80px) scale(.8)}}
.toast svg{width:17px;height:17px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.toast.ok{color:var(--success)}
.toast.err{color:var(--danger)}
.toast.info{color:var(--accent-3)}
.toast.warn{color:var(--warning)}
.toast span{color:var(--text);font-weight:normal}

/* ══════════════════════════════════════════════════════════════════
   EFFECTS
   ══════════════════════════════════════════════════════════════════ */
.confetti{
  position:fixed;top:0;left:0;width:10px;height:10px;
  z-index:9999;pointer-events:none;
  animation:confettiFall 2.5s linear forwards;
  will-change:transform,opacity;
}
@keyframes confettiFall{
  0%{transform:translate3d(0,0,0) rotate(0);opacity:1}
  100%{transform:translate3d(0,100vh,0) rotate(900deg);opacity:0}
}
.ripple{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.6),rgba(255,255,255,.1));
  transform:scale(0);pointer-events:none;
  animation:rippleAnim .7s var(--ease) forwards;
}
@keyframes rippleAnim{to{transform:scale(4);opacity:0}}

/* ══════════════════════════════════════════════════════════════════

async function fileHash(file){
  try{
    const buf = await file.arrayBuffer();
    const h = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return null; }
}

const DB_NAME = 'sitak-db-v2', STORE = 'forms';
let dbPromise = null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath:'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbPromise;
}
async function idbAll(){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readonly');
    const r = tx.objectStore(STORE).getAll();
    r.onsuccess = () => res(r.result || []);
    r.onerror = () => rej(r.error);
  });
}
async function idbPut(rec){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(rec);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function idbDel(id){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(id){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readonly');
    const r = tx.objectStore(STORE).get(id);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}

async function refreshCachedSigs(){
  const local = await idbAll();
  state.cachedSigs = new Set(local.map(r => sigOf(r.name, r.size)));
}

async function cacheOne(form){
  if(state.cachedSigs.has(sigOf(form.name, form.size))) return true;
  try{
    let blob = null;
    if(form.remote && form.path && state.connected && sb && navigator.onLine){
      const { data, error } = await sb.storage.from(SUPABASE_CONFIG.bucket).download(form.path);
      if(error) throw error;
      blob = data;
    } else if(form.blob){ blob = form.blob; }
    if(!blob) return false;
    const rec = {
      id: rnd(), name: form.name, blob: blob,
      size: form.size || blob.size,
      createdAt: form.createdAt || Date.now(),
      type: form.type || blob.type,
    };
    await idbPut(rec);
    state.cachedSigs.add(sigOf(rec.name, rec.size));
    return true;
  }catch(e){ console.warn('Cache error:', e); return false; }
}

async function syncCloudToLocal(silent = false){
  if(state.syncing) return {total:0, cached:0};
  if(!state.connected || !sb || !navigator.onLine){
    if(!silent) toast('برای همگام‌سازی به اینترنت نیازه', 'warn', 4000);
    return {total:0, cached:0};
  }
  state.syncing = true;
  updateSyncStatus('syncing', 'در حال همگام‌سازی…');
  await refreshCachedSigs();

  const cloudForms = state.forms.filter(f =>
    f.remote && !state.cachedSigs.has(sigOf(f.name, f.size))
  );

  if(!cloudForms.length){
    state.syncing = false;
    updateSyncStatus('done', 'همه آفلاین در دسترسن ✓');
    if(!silent) toast('همه‌ی فایل‌ها برای آفلاین ذخیره شدن ✓', 'ok', 3500);
    return {total:0, cached:0};
  }

  let cached = 0;
  for(let i = 0; i < cloudForms.length; i++){
    const form = cloudForms[i];
    updateSyncStatus('syncing', `(${fa(i+1)}/${fa(cloudForms.length)}) ${form.name.substring(0,20)}…`);
    const ok = await cacheOne(form);
    if(ok) cached++;
  }

  state.syncing = false;
  await refreshCachedSigs();
  renderAdminPanel();
  updateSyncStatus('done', `✓ ${fa(cached)} فایل ذخیره شد`);

  if(!silent){
    if(cached > 0) toast(`${fa(cached)} فایل برای آفلاین ذخیره شد ✓`, 'ok', 4000);
    else toast('فایل جدیدی نبود', 'info', 3000);
  }
  return {total: cloudForms.length, cached};
}

function shouldUseCloud(){
  if(state.mode === 'offline') return false;
  if(!state.connected || !sb) return false;
  if(!navigator.onLine) return false;
  return true;
}

async function fetchAllForms(){
  const localRaw = await idbAll();
  await refreshCachedSigs();
  const localMapped = localRaw.map(r => ({
    id:r.id, name:r.name, size:r.size, createdAt:r.createdAt,
    type:r.blob?.type || r.type, blob:r.blob, remote:false, cached:true,
  }));

  let cloudMapped = [];
  if(shouldUseCloud()){
    try{
      const { data, error } = await sb.from(SUPABASE_CONFIG.table).select('*').order('created_at', { ascending:false });
      if(error){ console.error('❌ fetch:', error); }
      else {
        cloudMapped = (data || []).map(r => {
          const sig = sigOf(r.name, r.file_size||0);
          return {
            id:r.id, name:r.name, size:r.file_size||0,
            createdAt:new Date(r.created_at).getTime(),
            type:r.file_type, path:r.file_path, remote:true,
            cached: state.cachedSigs.has(sig),
          };
        });
      }
    }catch(e){ console.error('Cloud fetch failed:', e); }
  }

  const seen = new Set();
  const merged = [];
  for(const l of localMapped){
    const key = sigOf(l.name, l.size);
    if(!seen.has(key)){ seen.add(key); merged.push(l); }
  }
  for(const c of cloudMapped){
    const key = sigOf(c.name, c.size);
    if(!seen.has(key)){ seen.add(key); merged.push(c); }
  }
  return merged.sort((a,b) => b.createdAt - a.createdAt);
}

async function uploadForm(file, name){
  const hash = await fileHash(file);
  const localRec = { id:rnd(), name, blob:file, size:file.size, createdAt:Date.now(), type:file.type };
  await idbPut(localRec);
  state.cachedSigs.add(sigOf(name, file.size));
  if(hash) saveHash(hash);

  if(shouldUseCloud()){
    try{
      const cloudId = rnd();
      const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
      const path = `${cloudId}.${ext}`;
      const { error: upErr } = await sb.storage.from(SUPABASE_CONFIG.bucket)
        .upload(path, file, { cacheControl:'3600', upsert:false, contentType:file.type||'application/octet-stream' });
      if(upErr) throw new Error(`Storage: ${upErr.message}`);
      const { error: dbErr } = await sb.from(SUPABASE_CONFIG.table)
        .insert({ id:cloudId, name, file_path:path, file_type:file.type||'', file_size:file.size });
      if(dbErr) throw new Error(`Table: ${dbErr.message}`);
      return { ...localRec, remote:true, path, cached:true };
    }catch(err){ console.warn('Cloud upload failed:', err); }
  }
  return { ...localRec, remote:false, cached:true };
}
function saveHash(hash){
  state.hashes.push(hash);
  state.hashes = state.hashes.slice(-500);
  localStorage.setItem('formban-hashes', JSON.stringify(state.hashes));
}
async function deleteFormRecord(form){
  if(form.remote && state.connected && sb && navigator.onLine){
    try{
      if(form.path) await sb.storage.from(SUPABASE_CONFIG.bucket).remove([form.path]);
      await sb.from(SUPABASE_CONFIG.table).delete().eq('id', form.id);
    }catch(e){ console.warn('Cloud delete:', e); }
  }
  const localRaw = await idbAll();
  const matches = localRaw.filter(r => r.name === form.name && r.size === form.size);
  for(const m of matches) await idbDel(m.id);
  state.cachedSigs.delete(sigOf(form.name, form.size));
}
async function getFormBlob(form){
  if(form.blob) return form.blob;
  const localRaw = await idbAll();
  const match = localRaw.find(r => r.name === form.name && r.size === form.size);
  if(match?.blob) return match.blob;
  if(form.remote && form.path && state.connected && sb && navigator.onLine){
    try{
      const { data, error } = await sb.storage.from(SUPABASE_CONFIG.bucket).download(form.path);
      if(error) throw error;
      try{
        await idbPut({ id:rnd(), name:form.name, blob:data, size:form.size, createdAt:form.createdAt, type:form.type });
        state.cachedSigs.add(sigOf(form.name, form.size));
      }catch(e){}
      return data;
    }catch(e){ console.warn('Download:', e); }
  }
  return null;
}
async function getFormUrl(form){
  const blob = await getFormBlob(form);
  if(blob) return URL.createObjectURL(blob);
  if(form.remote && form.path && sb){
    const { data } = sb.storage.from(SUPABASE_CONFIG.bucket).getPublicUrl(form.path);
    return data?.publicUrl || null;
  }
  return null;
}

function confirmDialog(title, text, okLabel='تأیید', isInfo=false){

function highlight(text, q){
  if(!q) return esc(text);
  const re = new RegExp('(' + escapeRegex(q) + ')', 'gi');
  return esc(text).replace(re, '<mark>$1</mark>');
}
function matchScore(name, q){
  const n = name.toLowerCase(), Q = q.toLowerCase();
  const idx = n.indexOf(Q);
  if(idx === -1) return -1;
  if(n === Q) return 0;
  if(n.startsWith(Q)) return 1;
  return 2 + idx/100 + name.length/10000;
}
function getResults(){
  const q = state.search.trim();
  if(!q) return [];
  let pool = state.forms;
  if(state.filter !== 'all') pool = pool.filter(f => fileKind(f.name, f.type).cat === state.filter);
  return pool.map(f => ({ form:f, score:matchScore(f.name, q) }))
    .filter(x => x.score >= 0)
    .sort((a,b) => a.score - b.score)
    .map(x => x.form);
}
function saveRecent(q){
  if(!q || q.length < 2) return;
  state.recent = state.recent.filter(r => r !== q);
  state.recent.unshift(q);
  state.recent = state.recent.slice(0, 5);
  localStorage.setItem('formban-recent', JSON.stringify(state.recent));
}
function removeRecent(q){
  state.recent = state.recent.filter(r => r !== q);
  localStorage.setItem('formban-recent', JSON.stringify(state.recent));
  renderDropdown();
}
function countByCat(cat){
  if(cat === 'all') return state.forms.length;
  return state.forms.filter(f => fileKind(f.name, f.type).cat === cat).length;
}

document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault(); searchInput.focus(); searchInput.select(); return;
  }
  if(!dropdown.classList.contains('show')) return;
  const items = $$('.res, .recent-item');
  if(!items.length) return;
  if(e.key === 'ArrowDown'){ e.preventDefault(); state.kbdIndex = (state.kbdIndex + 1) % items.length; updateKbdFocus(items); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); state.kbdIndex = state.kbdIndex <= 0 ? items.length - 1 : state.kbdIndex - 1; updateKbdFocus(items); }
  else if(e.key === 'Enter'){ if(state.kbdIndex >= 0 && items[state.kbdIndex]){ e.preventDefault(); items[state.kbdIndex].click(); } }
  else if(e.key === 'Escape'){ dropdown.classList.remove('show'); state.kbdIndex = -1; searchInput.blur(); }
});
function updateKbdFocus(items){
  items.forEach((it, i) => it.classList.toggle('kbd-focus', i === state.kbdIndex));

  if(active) active.scrollIntoView({ block:'nearest', behavior:'smooth' });
}

async function downloadForm(form){
  try{
    const blob = await getFormBlob(form);
    if(!blob){ toast('فایل پیدا نشد', 'err'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = form.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('دانلود شروع شد');
  }catch(e){ toast('خطا در دانلود: ' + (e.message||''), 'err'); }
}

async function printForm(form){
  try{
    const blob = await getFormBlob(form);
    if(!blob){ toast('فایل پیدا نشد', 'err'); return; }
    const type = blob.type || '';
    const isPdf   = type === 'application/pdf' || /\.pdf$/i.test(form.name);
    const isImage = type.startsWith('image/') || /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(form.name);
    const isText  = /\.(txt|md|json|xml|log|ini|yml|yaml)$/i.test(form.name) || (type.startsWith('text/') && !isPdf);
    if(isPdf){
      toast('در حال آماده‌سازی چاپ…', 'info', 2500);
      const url = URL.createObjectURL(blob);
      const iframe = document.createElement('iframe');
      iframe.style.cssText = 'position:fixed;inset-inline-end:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
      iframe.src = url; document.body.appendChild(iframe);
      let done = false;
      const go = () => {
        if(done) return; done = true;
        try{ iframe.contentWindow.focus(); iframe.contentWindow.print(); toast('پنجره چاپ باز شد 🖨️'); }
        catch(e){ window.open(url, '_blank'); }
        setTimeout(() => { iframe.remove(); URL.revokeObjectURL(url); }, 60000);
      };
      iframe.onload = () => setTimeout(go, 500);
      setTimeout(() => { if(iframe.parentNode) go(); }, 2500);
      return;
    }
    if(isImage){
      toast('در حال آماده‌سازی چاپ…', 'info', 2500);
      const url = URL.createObjectURL(blob);
      const w = window.open('', '_blank');
      if(!w){ URL.revokeObjectURL(url); toast('پنجره جدید مسدود شد', 'err'); return; }
      w.document.write(`<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><title>${esc(form.name)}</title>
        <style>@page{margin:10mm}html,body{margin:0;padding:0}
        body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#fff}
        img{max-width:100%;max-height:100vh;display:block;object-fit:contain}
        .bar{position:fixed;top:12px;inset-inline-end:12px;display:flex;gap:8px}
        .bar button{font-size:13px;font-weight:600;padding:9px 16px;border-radius:8px;cursor:pointer;border:none;background:#0e7490;color:#fff}
        .bar .alt{background:#f3f4f6;color:#374151}
        @media print{.bar{display:none!important}}</style>
        </head><body>
        <div class="bar"><button onclick="window.print()">🖨️ چاپ</button><button class="alt" onclick="window.close()">✕</button></div>
        <img src="${url}" onload="setTimeout(function(){window.focus();window.print()},400)">
        </body></html>`);
      w.document.close();
      toast('پنجره چاپ باز شد 🖨️');
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return;
    }
    if(isText){
      const text = await blob.text();
      const w = window.open('', '_blank');
      if(!w) return;
      w.document.write(`<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><title>${esc(form.name)}</title>
        <style>@page{margin:15mm}html,body{margin:0;padding:0;background:#fff}
        body{font-family:'BYekan',Tahoma,Arial,sans-serif;padding:15mm}
        pre{white-space:pre-wrap;word-break:break-word;direction:ltr;text-align:left;font-family:Consolas,monospace;font-size:12px;line-height:1.8;margin:0}
        .bar{position:fixed;top:12px;inset-inline-end:12px;display:flex;gap:8px}
        .bar button{font-size:13px;font-weight:600;padding:9px 16px;border-radius:8px;border:none;background:#0e7490;color:#fff;cursor:pointer}
        .bar .alt{background:#f3f4f6;color:#374151}
        @media print{.bar{display:none!important}body{padding:0}}</style>
        </head><body>
        <div class="bar"><button onclick="window.print()">🖨️ چاپ</button><button class="alt" onclick="window.close()">✕</button></div>
        <pre>${esc(text)}</pre>
        <script>window.onload=function(){setTimeout(function(){window.focus();window.print()},400)};<\/script>
        </body></html>`);
      w.document.close();
      toast('پنجره چاپ باز شد 🖨️');
      return;
    }
    const kind = fileKind(form.name, form.type);
    const ok = await confirmDialog('چاپ فایل ' + kind.label,
      `برای اینکه فایل <b>دقیقاً مثل اصل</b> چاپ بشه، باید فایل اصلی رو دانلود کنی.<br><br><span style="color:var(--accent-3)">دانلود بشه؟</span>`,
      'بله، دانلود کن', true);
    if(ok){ await downloadForm(form); toast('فایل دانلود شد', 'info', 5000); }
  }catch(e){ toast('خطا در چاپ: ' + (e.message||''), 'err', 4000); }
}

async function previewForm(form){

  const sub = $('#previewSub');
  const kind = fileKind(form.name, form.type);
  title.textContent = form.name;
  sub.textContent = `${kind.label} • ${fmtSize(form.size)} • ${fmtDate(form.createdAt)}`;
  body.innerHTML = `<div class="prev-load"><div class="spinner"></div>در حال بارگذاری…</div>`;
  $('#previewModal').classList.add('open');
  document.body.style.overflow = 'hidden';
  $('#previewDlBtn').onclick = () => downloadForm(form);
  const type = form.type || '';
  const isPdf = type === 'application/pdf' || /\.pdf$/i.test(form.name);
  const isImage = type.startsWith('image/') || /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(form.name);
  const isText = /\.(txt|md|json|xml|log|ini|yml|yaml)$/i.test(form.name) || (type.startsWith('text/') && !isPdf);
  try{
    if(isPdf){ const url = await getFormUrl(form); if(!url) throw new Error('در دسترس نیست'); body.innerHTML = `<iframe class="prev-frame" src="${url}#toolbar=1&navpanes=0&view=FitH"></iframe>`; return; }
    if(isImage){ const url = await getFormUrl(form); if(!url) throw new Error('در دسترس نیست'); body.innerHTML = `<img class="prev-img" src="${url}" alt="">`; return; }
    if(isText){ const blob = await getFormBlob(form); if(!blob) throw new Error('پیدا نشد'); const text = await blob.text(); body.innerHTML = `<pre class="prev-text">${esc(text)}</pre>`; return; }
    body.innerHTML = `
      <div class="prev-unsup" style="--fc:${kind.color}">
        <div class="ic"><svg viewBox="0 0 24 24">${GLYPHS[kind.glyph] || GLYPHS.file}</svg></div>
        <h4>پیش‌نمایش این فایل در مرورگر ممکن نیست</h4>
        <p>مرورگر نمی‌تونه فایل‌های ${kind.label} رو مستقیم نمایش بده. برای مشاهده دانلود کن.</p>
        <button class="btn btn-primary" id="prevDlBtn2" style="margin:0 auto">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          <span>دانلود فایل</span>
        </button>
      </div>`;
    const btn = document.getElementById('prevDlBtn2');
    if(btn) btn.onclick = () => $('#previewDlBtn').click();
  }catch(e){
    body.innerHTML = `<div class="prev-unsup" style="--fc:var(--danger)">
      <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></div>
      <h4>خطا در بارگذاری</h4>
      <p>${esc(e.message||'مشکلی پیش اومد')}</p>
    </div>`;
  }
}

async function deleteForm(form){
  if(!state.isAdmin){ toast('فقط مدیر', 'err'); return; }
  const ok = await confirmDialog('حذف فرم', `آیا از حذف <b>«${esc(form.name)}»</b> مطمئنی؟`, 'حذف کن', false);
  if(!ok) return;
  try{
    await deleteFormRecord(form);
    state.forms = state.forms.filter(f => f.id !== form.id);
    render();
    toast('فرم حذف شد');
  }catch(e){ toast('خطا در حذف: ' + (e.message||''), 'err'); }
}

const uploadModal = $('#uploadModal');
const fileInput = $('#fileInput');
const dropZone = $('#dropZone');
const pendingList = $('#pendingList');
const saveBtn = $('#saveBtn');
const progressArea = $('#progressArea');
let pending = [];

function openUpload(){
  if(!state.isAdmin){ openLogin(); return; }
  pending = []; fileInput.value = ''; progressArea.innerHTML = '';
  renderPending();
  uploadModal.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeUpload(){
  uploadModal.classList.remove('open');
  document.body.style.overflow = '';
  pending = []; progressArea.innerHTML = ''; renderPending();
}
function renderPending(){
  if(!pending.length){
    pendingList.innerHTML = '';
    saveBtn.disabled = true;
    saveBtn.textContent = 'ذخیره فرم‌ها';
    dropZone.style.display = 'block';
    return;
  }
  dropZone.style.display = 'none';
  const validCount = pending.filter(p => p.status !== 'duplicate').length;
  saveBtn.disabled = validCount === 0;
  saveBtn.textContent = validCount > 0 ? `ذخیره ${fa(validCount)} فرم` : 'فایلی برای ذخیره نیست';

  pendingList.innerHTML = pending.map((p,i) => {
    const kind = fileKind(p.name + '.' + (p.file.name.split('.').pop()||''), p.file.type);
    const dis = state.nameMode === 'auto' ? 'disabled' : '';
    let errHtml = '';
    if(p.status === 'duplicate') errHtml = `<div class="p-warn">⚠️ این فایل قبلاً آپلود شده</div>`;
    else if(p.error) errHtml = `<div class="p-err">❌ ${esc(p.error)}</div>`;
    const cls = p.status === 'duplicate' ? 'duplicate' : (p.error ? 'failed' : '');
    return `
      <div class="p-item ${cls}" style="--fc:${kind.color}; animation-delay:${i*40}ms" data-idx="${i}">
        <div class="p-ico"><svg viewBox="0 0 24 24">${GLYPHS[kind.glyph] || GLYPHS.file}</svg></div>
        <div class="p-info">
          <input type="text" value="${esc(p.name)}" data-idx="${i}" data-role="name" ${dis} placeholder="اسم فرم…">
          <div class="p-meta">${fmtSize(p.file.size)} • ${kind.label}</div>
          ${errHtml}
        </div>
        <button class="rm-p" data-idx="${i}" data-role="remove" type="button">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>`;
  }).join('');
}
async function addFiles(list){
  if(!state.isAdmin){ openLogin(); return; }
  const files = Array.from(list || []);
  if(!files.length) return;
  const existingSigs = new Set(state.forms.map(f => sigOf(f.name, f.size)));
  const pendingSigs = new Set(pending.map(p => sigOf(p.name, p.file.size)));
  for(const f of files){
    const autoName = cleanName(f.name);
    const sig = sigOf(autoName, f.size);
    let isDup = existingSigs.has(sig) || pendingSigs.has(sig);
    if(!isDup && state.hashes.length){
      const h = await fileHash(f);
      if(h && state.hashes.includes(h)) isDup = true;
    }
    pending.push({ file: f, name: autoName, status: isDup ? 'duplicate' : 'ok' });
    pendingSigs.add(sig);
  }
  renderPending();
  const dupCount = pending.filter(p => p.status === 'duplicate').length;
  if(dupCount > 0) toast(`${fa(dupCount)} فایل تکراری نادیده گرفته شد`, 'warn', 4000);
}
dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => addFiles(e.target.files));
['dragenter','dragover'].forEach(ev =>
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('over'); })
);
['dragleave','drop'].forEach(ev =>
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('over'); })
);
dropZone.addEventListener('drop', e => addFiles(e.dataTransfer.files));
pendingList.addEventListener('input', e => {
  if(e.target.dataset.role === 'name'){
    const i = +e.target.dataset.idx;
    if(pending[i]) pending[i].name = e.target.value;
  }
});
pendingList.addEventListener('click', e => {
  const btn = e.target.closest('[data-role="remove"]');
  if(!btn) return;
  pending.splice(+btn.dataset.idx, 1);
  renderPending();
});
$$('.mode-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.mode-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.nameMode = btn.dataset.mode;
    if(state.nameMode === 'auto') pending.forEach(p => { p.name = cleanName(p.file.name); });
    renderPending();
  });
});

saveBtn.addEventListener('click', async () => {
  if(!state.isAdmin){ openLogin(); return; }
  const valid = pending.filter(p => p.status !== 'duplicate');
  if(!valid.length) return;
  saveBtn.disabled = true;
  saveBtn.textContent = 'در حال آپلود…';
  progressArea.innerHTML = `
    <div class="progress">
      <div class="p-ring">
        <svg viewBox="0 0 64 64">
          <circle class="bg-c" cx="32" cy="32" r="28"/>
          <circle class="fg-c" id="pRingFg" cx="32" cy="32" r="28"
            stroke-dasharray="${2*Math.PI*28}" stroke-dashoffset="${2*Math.PI*28}"/>
        </svg>
        <div class="p-ring-txt" id="pRingTxt">۰٪</div>
      </div>
      <div class="p-body">
        <div class="p-top">در حال آپلود…</div>
        <div class="p-name" id="pName"></div>
      </div>
    </div>`;
  const ring = $('#pRingFg'), ringTxt = $('#pRingTxt'), nameEl = $('#pName');
  const C = 2 * Math.PI * 28;
  const total = valid.length;
  let ok = 0, firstErr = null;
  for(let i = 0; i < total; i++){
    const p = valid[i];
    nameEl.textContent = `(${fa(i+1)}/${fa(total)}) ${p.name}`;
    const pct = i / total;
    ring.style.strokeDashoffset = C * (1 - pct);
    ringTxt.textContent = Math.round(pct*100).toLocaleString('fa-IR') + '٪';
    try{
      const rec = await uploadForm(p.file, p.name.trim() || p.file.name);
      state.forms.unshift(rec);
      ok++;
      const idx = pending.indexOf(p);
      const itemEl = pendingList.querySelector(`.p-item[data-idx="${idx}"]`);
      if(itemEl) itemEl.classList.add('done');
    }catch(err){
      const msg = err?.message || String(err);
      if(!firstErr) firstErr = msg;
      p.error = msg;
    }
  }
  ring.style.strokeDashoffset = 0;
  ringTxt.textContent = '۱۰۰٪';
  if(ok === total){
    confetti();
    setTimeout(() => { closeUpload(); render(); toast(`${fa(ok)} فرم ذخیره شد 🎉`); }, 500);
  } else if(ok > 0){
    setTimeout(() => { closeUpload(); render(); toast(`${fa(ok)} ذخیره شد، ${fa(total-ok)} خطا`, 'warn', 4000); }, 1000);
  } else {
    saveBtn.disabled = false;
    saveBtn.textContent = 'تلاش مجدد';
    if(firstErr) toast('خطا: ' + firstErr, 'err', 8000);
  }
});

$('#uploadBtn').addEventListener('click', openUpload);
$('#closeUpload').addEventListener('click', closeUpload);
$('#cancelUpload').addEventListener('click', closeUpload);
uploadModal.addEventListener('click', e => { if(e.target === uploadModal) closeUpload(); });

let dragDepth = 0;
window.addEventListener('dragenter', e => {
  if(!state.isAdmin) return;
  if(e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')){
    dragDepth++;
    if(!uploadModal.classList.contains('open')) openUpload();
    dropZone.classList.add('over');
  }
});
window.addEventListener('dragover', e => { if(state.isAdmin && e.dataTransfer) e.preventDefault(); });
window.addEventListener('dragleave', () => {
  if(!state.isAdmin) return;
  dragDepth = Math.max(0, dragDepth-1);
  if(dragDepth === 0) dropZone.classList.remove('over');
});
window.addEventListener('drop', e => {
  if(!state.isAdmin) return;
  if(e.dataTransfer && e.dataTransfer.files.length){
    e.preventDefault();
    dragDepth = 0;
    if(!uploadModal.classList.contains('open')) openUpload();
    addFiles(e.dataTransfer.files);
  }
});

const previewModal = $('#previewModal');
function closePreview(){
  previewModal.classList.remove('open');
  document.body.style.overflow = '';
  $('#previewBody').innerHTML = '';
}
$('#closePreview').addEventListener('click', closePreview);
$('#previewCloseBtn').addEventListener('click', closePreview);
previewModal.addEventListener('click', e => { if(e.target === previewModal) closePreview(); });

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(confirmModal.classList.contains('open')) resolveConfirm(false);
    else if(loginModal.classList.contains('open')) closeLogin();
    else if(uploadModal.classList.contains('open')) closeUpload();
    else if(previewModal.classList.contains('open')) closePreview();
    else dropdown.classList.remove('show');
  }
});

function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.theme);
  $('#themeBtn').innerHTML = state.theme === 'dark'
    ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
  localStorage.setItem('formban-theme', state.theme);
}
$('#themeBtn').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
});

/* PWA Icons — تولید PNG از SVG */
function generatePngIcon(size){
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, size, size);
      try { resolve(c.toDataURL('image/png')); } catch(e){ resolve(LOGO_DATA_URI); }
    };
    img.onerror = () => resolve(LOGO_DATA_URI);
    img.src = LOGO_DATA_URI;
  });
}

async function buildManifest(){
  const baseUrl = new URL('.', location.href).href;
  const [p192, p512, p512m] = await Promise.all([
    generatePngIcon(192),
    generatePngIcon(512),
    generatePngIcon(512)
  ]);
  const manifest = {
    name: 'جعبه ابزار کفپوش سی تک پارسیان',
    short_name: 'سی تک پارسیان',
    description: 'کتابخانه هوشمند فرم‌های کفپوش سی تک پارسیان',
    start_url: baseUrl, scope: baseUrl,
    display: 'standalone',
    display_override: ['window-controls-overlay','standalone','minimal-ui'],
    orientation: 'any',
    background_color: '#080b14',
    theme_color: '#0e7490',
    lang: 'fa', dir: 'rtl',
    categories: ['business','productivity','utilities'],
    icons: [
      { src: p192, sizes:'192x192', type:'image/png', purpose:'any' },
      { src: p512, sizes:'512x512', type:'image/png', purpose:'any' },
      { src: p512m, sizes:'512x512', type:'image/png', purpose:'maskable' },
    ],
    shortcuts: [
      { name: 'افزودن فرم', short_name: 'افزودن', url: baseUrl + '?action=upload',
        icons: [{ src: p192, sizes: '192x192', type: 'image/png' }] }
    ],
  };
  const blob = new Blob([JSON.stringify(manifest)], { type:'application/manifest+json' });
  document.getElementById('manifestLink').href = URL.createObjectURL(blob);
}

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope:'./' })
      .then(() => console.log('%c✅ Service Worker ثبت شد', 'color:#22c55e;font-weight:bold'))
      .catch(err => console.warn('SW error:', err));
  });
}

let deferredInstall = null;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstall = e;
  installBtn.classList.add('show');
});
installBtn.addEventListener('click', async () => {
  if(!deferredInstall){ toast('از منوی مرورگر → Install', 'info', 4000); return; }
  deferredInstall.prompt();
  const { outcome } = await deferredInstall.userChoice;
  deferredInstall = null;
  installBtn.classList.remove('show');
  if(outcome === 'accepted') toast('سی تک پارسیان نصب شد 🎉', 'ok', 3500);
});
window.addEventListener('appinstalled', () => {
  installBtn.classList.remove('show');
  deferredInstall = null;
  toast('سی تک پارسیان نصب شد 🎉');
});

  applyTheme();
  applyMode();
  console.log('%c🚀 سی تک پارسیان', 'color:#06b6d4;font-weight:bold;font-size:15px');
  await buildManifest();
  initSupabase();
  await refreshCachedSigs();
  try{
    state.forms = await fetchAllForms();
    console.info(`%c📋 ${state.forms.length} فرم آماده شد`, 'color:#f59e0b;font-weight:bold');
  }catch(e){
    console.error('Init error:', e);
    state.forms = [];
  }
  render();

    setTimeout(() => syncCloudToLocal(true), 1500);
  }
